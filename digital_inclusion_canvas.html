ding-bottom:10px;margin:0 -28px;padding-left:28px;padding-right:28px}\n@media (max-width:900px){.canvas{height:auto}.tcard{height:auto}.tbody{overflow:visible}.panel{height:auto;overflow:visible}.grid{grid-template-rows:none}}\n\n/* ===== pager instead of horizontal scroll ===== */\n.cards{overflow:hidden !important;scroll-snap-type:none !important}\n.cards .card{flex:0 0 var(--cw,250px) !important}\n.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px}\n.pager.off{visibility:hidden}\n.pg{width:28px;height:28px;border-radius:50%;border:1px solid var(--plum);background:transparent;color:var(--plum);cursor:pointer;line-height:1;padding:0}\n.pg:hover:not(:disabled){background:var(--plum);color:#fff}\n.pg:disabled{opacity:.3;cursor:default}\n.pgc{color:var(--muted);font-style:italic;font-size:12px !important;min-width:64px;text-align:center}\n\n/* ===== pager arrows closer ===== */\n.pager{gap:4px !important}\n.pgc{min-width:0 !important;padding:0 4px}\n/* ===== analytics as key finding ===== */\n.an2.top{margin-top:30px}\n.arow{margin-bottom:28px}\n.alab{font-style:normal;color:var(--ink);font-weight:500;margin-bottom:10px}\n.share{grid-template-columns:76px 1fr 64px !important;margin:8px 0 !important}\n.share span:last-child{font-size:18px !important;font-weight:600;color:var(--plum);text-align:right}\n.track{height:14px !important}\n.sb{height:28px !important;border-radius:8px !important;margin:2px 0 8px !important}\n\n/* ===== add to matrix ===== */\n.add{cursor:pointer;font:inherit}\n.add:hover{background:#F3ECF6}\n.add.on{background:var(--plum) !important;color:#fff !important}\n.tile{position:relative}\n.tile .inm{position:absolute;top:12px;right:12px;font-size:11px !important;line-height:1;font-style:normal;font-weight:400;color:var(--plum);opacity:.8}\n.tile.on .inm{color:#fff}\n.tile.added{padding-right:28px !important}\n.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#2a1f30;color:#fff;border-radius:999px;padding:10px 18px;transition:all .25s;z-index:60;white-space:nowrap}\n.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}\n.toast b{color:#fff}\n.tlink{color:#d9b8ec;margin-left:10px;cursor:pointer;text-decoration:underline}\n\n/* share chart: honest 0–100% scale, bar on its own line */\n.share2{margin:6px 0 10px}\n.sh2l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}\n.sh2l b{font-size:18px !important;font-weight:600;color:var(--plum)}\n.share2 .track{height:12px !important}\n.scale{display:flex;justify-content:space-between;font-size:11px !important;color:var(--muted);margin-top:-4px}\n\n/* ===== collapsible analytics ===== */\n.acc{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;width:100%;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}\n.acc:focus-visible{outline:2px solid var(--plum);outline-offset:4px;border-radius:4px}\n.acc .chev{flex:none;color:var(--plum);transition:transform .2s;align-self:center}\n.acc[aria-expanded=\"true\"] .chev{transform:rotate(90deg)}\n.asum{text-transform:none;letter-spacing:0;font-weight:400;font-style:italic;color:var(--muted);font-size:13px !important}\n.acc[aria-expanded=\"true\"] .asum{visibility:hidden}\n.an2.top{margin-bottom:22px}\n.arow[hidden]{display:none !important}\n.gomx{margin:4px 0 0 !important}\n#arow + .sec{margin-top:30px}\n\n/* same scrollbar for capability list and info panel */\n.grid::-webkit-scrollbar,.panel::-webkit-scrollbar{width:8px}\n.grid::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track{background:transparent}\n.grid::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb{background:rgba(98,18,122,.35);border-radius:4px}\n\n/* ===== new capability ===== */\n.tile.newcap{border:1px dashed rgba(98,18,122,.5) !important;background:transparent !important;color:var(--plum) !important;font:inherit;text-align:left;cursor:pointer;justify-content:flex-start}\n.tile.newcap:hover{background:rgba(98,18,122,.06) !important}\n.tile.newcap .plus{font-size:22px !important;line-height:1;margin-bottom:6px;font-weight:300}\n.tile.user{border-style:dashed !important;background:rgba(176,138,90,.16) !important}\n.tile.user.on{background:var(--plum) !important}\n.capwrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\n.useredit{display:inline-flex;gap:10px}\n.useredit[hidden]{display:none}\n.useredit button{all:unset;cursor:pointer;color:var(--muted);font-style:italic;font-size:12px !important;text-decoration:underline}\n.useredit button:hover{color:var(--plum)}\n.ustat{font-style:italic;color:var(--muted)}\n.ev.usr{color:#8a6a3e;border-style:dashed}\n.nform{display:flex;flex-direction:column;gap:12px}\n.nform label{display:flex;flex-direction:column;gap:4px;color:var(--ink);font-weight:500}\n.nform input,.nform textarea,.nform select{font:inherit;font-weight:400;border:1px solid rgba(98,18,122,.3);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}\n.nform input:focus,.nform textarea:focus,.nform select:focus{outline:2px solid var(--plum);outline-offset:0;border-color:transparent}\n.nform fieldset{border:1px solid rgba(98,18,122,.2);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;margin:0}\n.nform legend{padding:0 6px;color:var(--ink);font-weight:500}\n.frow{display:grid;grid-template-columns:2fr 1fr;gap:10px}\n.fhint{margin:-4px 0 4px;color:var(--muted);font-size:13px !important}\n.req{color:var(--plum)} .opt{color:var(--muted);font-weight:400;font-style:italic;font-size:12px !important}\n.ferr{margin:0;color:#b42318;font-size:13px !important;min-height:0}\n.factions{display:flex;justify-content:flex-end;gap:10px;align-items:center}\n.fcancel{all:unset;cursor:pointer;color:var(--plum);padding:6px 10px}\n.fsave{border:0;font:inherit;font-style:italic}\n\n/* ===== embedded in the Digital Inclusion Canvas (node header replaces the card header) ===== */\nbody{background:#fff !important}\n.canvas{padding:0 !important;background:#fff !important;height:100vh !important;display:block}\n.tcard{width:100% !important;height:100vh !important;border-radius:0 !important;box-shadow:none !important}\n.thead{display:none !important}\n.tbody{padding:20px 24px 20px !important}\n/* ===== canvas typography & chrome (matches the Digital Inclusion Canvas cards) ===== */\n:root{--ink:#241a30;--muted:#726480;--lav:#e4dfeb}\nbody,.tcard,button,input,select,textarea{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif !important}\nbody{color:var(--ink)}\n/* section titles = canvas labels */\n.plbl,.sh,.sec h3,.acc,.lhead b{font-size:10px !important;font-weight:800 !important;letter-spacing:.05em !important;text-transform:uppercase;color:var(--plum) !important;font-style:normal !important}\n.acc .chev{color:var(--plum)}\n.lhead{align-items:center !important;padding-top:2px !important}\n.lhead .sl{font-size:12px !important}\n.seg button,.seg button span{font-size:12px !important}\n/* capability name = canvas node title */\n.capname{font-size:16px !important;font-weight:700 !important;font-style:normal !important;color:var(--ink) !important}\n.dtext{font-size:12.5px !important;line-height:1.6 !important;color:var(--ink) !important}\n.stat{font-size:11.5px !important;padding:5px 10px !important;border-radius:999px !important;border-color:var(--lav) !important}\n.stat b{font-size:13px !important;font-style:normal !important}\n/* tiles */\n.tile{font-size:12.5px !important;font-weight:600;border-radius:12px !important;padding:12px !important}\n.tile small{font-size:11px !important;font-weight:400}\n.tile.added{padding-right:24px !important}\n.tile .inm{font-size:10px !important;top:10px;right:10px}\n.tile.newcap .plus{font-size:18px !important}\n/* buttons = canvas pill buttons */\n.mlink{font-size:10.5px !important;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-style:normal !important;padding:6px 12px !important;background:#7c3aed !important;border-color:#7c3aed !important}\n.add{font-size:10.5px !important;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px !important;border:1px solid rgba(168,85,247,.45) !important;color:#7c3aed !important;background:#fff}\n.add.on{background:#7c3aed !important;border-color:#7c3aed !important;color:#fff !important}\n.info{width:16px;height:16px;line-height:14px;font-size:10px !important}\n/* panel */\n.panel{background:#f5f2f9 !important;border:1px solid var(--lav);border-radius:14px !important}\n.panel .phead{background:#f5f2f9 !important}\n/* application cards */\n.card{border-radius:10px !important;border-color:var(--lav) !important;padding:10px !important}\n.card p{font-size:12px !important;line-height:1.5}\n.chip,.ev{font-size:10.5px !important}\n.pg{width:24px !important;height:24px !important;font-size:12px !important}\n.pgc{font-size:10.5px !important}\n/* analytics */\n.alab{font-size:11.5px !important;font-weight:700}\n.sh2l span,.share2 span{font-size:11.5px !important}\n.sh2l b{font-size:14px !important}\n.scale{font-size:10px !important}\n.asum{font-size:11.5px !important}\n.note,.leg,.leg *{font-size:10.5px !important}\n/* evidence & limitations */\n.pl li{font-size:12px !important;line-height:1.55;color:var(--ink)}\n.pl li b{font-size:12px !important}\n.pl .src{font-size:10.5px !important}\n.evsub,.evsub small{font-size:10px !important;font-weight:800;letter-spacing:.05em}\n.empty{font-size:12px !important}\n/* label key, modal, form */\n.key dd{font-size:11.5px !important;line-height:1.5}\n.modal{border-radius:14px !important;border-color:var(--lav) !important;box-shadow:0 10px 30px rgba(0,0,0,.35)}\n.modal h4{font-size:14px !important;font-style:normal !important;font-weight:700 !important;color:var(--ink) !important}\n.modal dt,.modal dd,.modal li{font-size:12px !important}\n.nform label,.nform legend{font-size:12px !important;font-weight:700}\n.nform input,.nform textarea,.nform select{font-size:12px !important;border-radius:8px !important;border-color:var(--lav) !important;background:#f5f2f9 !important}\n.fhint,.ferr{font-size:11.5px !important}\n.opt{font-size:10.5px !important}\n.useredit button{font-size:11px !important}\n.toast,.toast *{font-size:12.5px !important}\n\n/* ===== matrix style, capability blue (Oct 8) ===== */\n:root{--cap:#1d4ed8;--cap-dim:rgba(29,78,216,.14);--cap-mid:rgba(29,78,216,.22);--cap-on:rgba(29,78,216,.7);--cap-dark:#0e2569;\n  --plum:#1d4ed8;--line:#e4dfeb;--ink:#241a30;--muted:#726480;\n  --olive:#65792a;--violet:#7e22ce;--orange:#D97F00;--grey:#77736b}\nhtml,body{background:#fff !important}\n.canvas,.tcard{background-color:#fff !important;background-image:radial-gradient(rgba(36,26,48,.07) 1px,transparent 1px) !important;background-size:22px 22px !important}\nbody *{font-size:13px !important}\n/* column-head style titles */\n.plbl,.sh,.sec h3,.acc,.lhead b{font-size:13px !important;font-weight:800 !important;letter-spacing:.02em !important;text-transform:uppercase;color:var(--ink) !important}\n.acc .chev{color:var(--ink) !important}\n/* sector filter = matrix view-bar pills */\n.seg.sect{gap:8px !important}\n.seg.sect button{font-size:13px !important;font-weight:600;font-style:normal !important;color:var(--ink);opacity:1 !important;background:#fff;border:1px solid var(--line) !important;border-radius:999px;padding:5px 14px !important}\n.seg.sect button:hover{background:rgba(29,78,216,.07);border-color:rgba(29,78,216,.4) !important}\n.seg.sect button.on{background:var(--cap) !important;border-color:var(--cap) !important;color:#fff !important}\n.lhead{height:auto !important;margin-bottom:14px;gap:12px !important}\n/* tiles = matrix capability cells */\n.tile{border:1.5px solid var(--cap) !important;background:var(--cap-mid) !important;color:var(--cap) !important;border-radius:9px !important;font-weight:400 !important}\n.tile small{color:var(--cap) !important;opacity:.85}\n.tile.on{background:var(--cap-on) !important;color:var(--cap-dark) !important}\n.tile.on small,.tile.on .inm{color:var(--cap-dark) !important}\n.tile .inm{color:var(--cap) !important}\n.tile.slr{border-style:dashed !important}\n.tile.newcap{border:1.5px dashed rgba(29,78,216,.5) !important;background:#fff !important;color:var(--cap) !important}\n.tile.user{border-color:#8f7352 !important;background:rgba(143,115,82,.3) !important;color:#5e4a33 !important}\n.tile.user small{color:#5e4a33 !important}\n/* panel: white, separated by a line (no lilac fill) */\n.panel{background:transparent !important;border:0 !important;border-left:1px solid var(--line) !important;border-radius:0 !important}\n.panel .phead{background:#fff !important}\n.capname{font-size:19px !important;font-weight:800 !important;color:var(--ink) !important;letter-spacing:-.01em}\n.dtext{font-size:13px !important;line-height:1.55 !important}\n.stat{background:#fff !important;border:1px solid var(--line) !important}\n.stat b{color:var(--cap) !important}\n/* buttons = matrix legend buttons */\n.add,.mlink{font-size:12px !important;font-weight:700 !important;letter-spacing:.04em;text-transform:uppercase;font-style:normal !important;border-radius:7px !important;padding:6px 12px !important;border:1px solid rgba(29,78,216,.4) !important;background:transparent !important;color:var(--cap) !important}\n.add:hover,.mlink:hover{background:rgba(29,78,216,.1) !important}\n.add.on{background:var(--cap) !important;border-color:var(--cap) !important;color:#fff !important}\n.info{border-color:var(--cap) !important;color:var(--cap) !important}\n.info[aria-expanded=\"true\"]{background:var(--cap) !important;color:#fff !important}\n.seg:not(.sect) button{color:var(--cap) !important;font-size:12.5px !important}\n.seg:not(.sect) button.on{border-bottom-color:var(--cap) !important}\n.pg{border-color:var(--cap) !important;color:var(--cap) !important}\n.pg:hover:not(:disabled){background:var(--cap) !important;color:#fff !important}\n/* application cards and chips = matrix case-study cells */\n.card{position:relative;border-radius:9px !important;border:1px solid var(--line) !important;background:#fff !important;padding-bottom:16px !important}\n.card:hover,.card:focus-visible{border-color:var(--cap) !important;box-shadow:0 2px 10px rgba(29,78,216,.12) !important}\n.chip{background:transparent !important;border:1.5px solid;border-radius:7px !important;font-style:normal !important;font-size:11.5px !important;padding:2px 8px !important}\n.chip.sec-finance{border-color:#65792a;color:#3e4a17 !important;background:rgba(101,121,42,.3) !important}\n.chip.sec-government{border-color:#7e22ce;color:#3f0f68 !important;background:rgba(126,34,206,.3) !important}\n.chip.sec-healthcare{border-color:#D97F00;color:#3D2300 !important;background:rgba(254,147,7,.3) !important}\n.chip.sec-nonspecified{border-color:#77736b;color:#2c2a26 !important;background:rgba(119,115,107,.3) !important}\n.chip.sec-slrother{border-color:#8f7352;color:#3b2e1e !important;background:rgba(143,115,82,.3) !important}\n.ev{font-size:11px !important;color:var(--ink) !important;border-color:rgba(36,26,48,.45) !important}\n.ev.ins{color:var(--muted) !important;border-color:var(--line) !important}\n.ev.usr{color:#5e4a33 !important}\n.dev-bar{position:absolute;left:10px;right:10px;bottom:5px;height:6px;display:flex;gap:2px}\n.dev-bar i{flex:1 1 0;border-radius:1px;background:#fff;border:1px solid #c3c7cd}\n.dev-bar i.f{background:#241a30;border-color:#241a30}\n/* analytics: matrix sector colours; evidence types in blue */\n.alab{color:var(--ink) !important;font-size:12.5px !important}\n.track{background:rgba(29,78,216,.08) !important}\n.sh2l b{color:var(--cap) !important;font-size:15px !important}\n.share2 .track div[style*=\"#6A2A7C\"]{background:var(--cap) !important}\n.sb div[style*=\"#62127A\"]{background:var(--cap) !important}\n.sb div[style*=\"#b48ccf\"]{background:rgba(29,78,216,.45) !important}\n.sb div[style*=\"#e3d3ea\"]{background:rgba(29,78,216,.15) !important}\n.leg i[style*=\"#62127A\"]{background:var(--cap) !important}\n.leg i[style*=\"#b48ccf\"]{background:rgba(29,78,216,.45) !important}\n.leg i[style*=\"#e3d3ea\"]{background:rgba(29,78,216,.15) !important}\n.note,.leg,.leg *,.scale,.pgc,.pl .src{font-size:11px !important}\n/* evidence */\n.evsub,.evsub small{color:var(--cap) !important;font-size:11px !important}\n.pl li,.pl li b{font-size:12.5px !important}\n.el>div:last-child{border-left-color:var(--line) !important}\n/* modal + form */\n.modal{border:1px solid var(--line) !important;border-radius:10px !important}\n.modal h4{font-size:16px !important;font-weight:800 !important}\n.modal .x{color:var(--ink) !important}\n.nform input:focus,.nform textarea:focus,.nform select:focus{outline-color:var(--cap) !important}\n.req{color:var(--cap) !important}\n.fcancel{color:var(--cap) !important}\n.toast,.toast *{font-size:12.5px !important}\n\n.modal .ptype{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}\n.modal p.about{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--ink)}\n.modal .here{margin:12px 0 0;padding:8px 11px;border-left:3px solid var(--cap);background:var(--cap-dim);border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}\n.modal .here .hl{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--cap);margin-bottom:2px}\n.modal dd.capchips{display:flex;flex-wrap:wrap;gap:4px}\n.capchip{font:inherit;font-size:11.5px !important;line-height:1.3;padding:3px 9px;border-radius:999px;border:1px solid var(--cap);background:#fff;color:var(--cap);cursor:pointer}\n.capchip:hover{background:var(--cap-dim)}\n.capchip.cur{background:var(--cap);color:#fff;cursor:default}\n.modal .onote{display:block;margin-top:4px;font-style:italic;color:var(--muted);font-size:11.5px !important}\n.evnote{margin:-4px 0 10px;font-size:12px;font-style:italic;color:var(--muted)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"canvas\">\n\u003csection class=\"tcard\" aria-labelledby=\"ttitle\">\n  \u003cheader class=\"thead\">\n    \u003cspan class=\"tpill\">Tool\u003c/span>\n    \u003cbutton class=\"tx\" aria-label=\"Close\">×\u003c/button>\n    \u003ch2 class=\"ttitle\" id=\"ttitle\">GenAI Capabilities Library\u003c/h2>\n    \u003cp class=\"tsub\">Explore what GenAI can do for digital inclusion: where each capability has been applied, for whom, and with what evidence.\u003c/p>\n  \u003c/header>\n  \u003cdiv class=\"tbody\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv>\n      \u003cdiv class=\"lhead\">\u003cb>Capabilities\u003c/b>\u003cspan class=\"sl\">\u003c/span>\n        \u003cdiv class=\"seg sect\">\u003cbutton class=\"on\" data-s=\"all\">All\u003c/button>\u003cbutton data-s=\"Finance\">Finance\u003c/button>\u003cbutton data-s=\"Public\">Public\u003c/button>\u003cbutton data-s=\"Healthcare\">Healthcare\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"phead\">\u003cspan class=\"capwrap\">\u003cspan class=\"capname\" id=\"capname\">\u003c/span>\u003cspan class=\"useredit\" id=\"useredit\" hidden>\u003cbutton type=\"button\" id=\"editCap\">Edit\u003c/button>\u003cbutton type=\"button\" id=\"delCap\">Delete\u003c/button>\u003c/span>\u003c/span>\u003cbutton class=\"add\" id=\"addBtn\" aria-pressed=\"false\">+ Add to matrix\u003c/button>\u003c/div>\n      \u003cspan class=\"plbl dlbl\">Description\u003c/span>\n      \u003cdiv class=\"drow\">\u003cp class=\"dtext\" id=\"desc\">\u003c/p>\u003c/div>\n      \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n      \u003ca class=\"mlink gomx\" id=\"gomx\">Go to Digital Inclusion Matrix →\u003c/a>\n      \u003ch3 class=\"sh an2 top\">\u003cbutton class=\"acc\" id=\"accBtn\" aria-expanded=\"false\" aria-controls=\"arow\">\u003csvg class=\"chev\" width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003cpath d=\"M3 1.5 6.5 5 3 8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>Analytics\u003cspan class=\"asum\" id=\"asum\">\u003c/span>\u003c/button>\u003c/h3>\n      \u003cdiv class=\"arow\" id=\"arow\" hidden>\n        \u003cdiv>\u003cdiv class=\"alab\">Industry vs literature\u003c/div>\u003cdiv id=\"a-share\">\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"alab\">Case studies by sector\u003c/div>\u003cdiv id=\"a-sector\">\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"alab\">Case studies by evidence type\u003c/div>\u003cdiv id=\"a-ev\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sec\">\n        \u003cdiv class=\"apphead\">\u003cdiv class=\"hl\">\u003ch3>Applications\u003c/h3>\u003cbutton class=\"info\" id=\"infoBtn\" aria-expanded=\"false\" aria-controls=\"key\" title=\"What do the labels mean?\">i\u003c/button>\u003c/div>\n          \u003cdiv class=\"seg\" id=\"appf\">\n            \u003cbutton class=\"on\" data-f=\"all\">All \u003cspan>\u003c/span>\u003c/button>\n            \u003cbutton data-f=\"ind\">Industry \u003cspan>\u003c/span>\u003c/button>\n            \u003cbutton data-f=\"lit\">Literature \u003cspan>\u003c/span>\u003c/button>\n          \u003c/div>\u003c/div>\n        \u003cdiv class=\"key\" id=\"key\">\u003cdl>\n          \u003cdt>\u003cspan class=\"ev rep\">reported\u003c/span>\u003c/dt>\u003cdd>Industry case built explicitly for digital inclusion (D1); the source names the population or barrier it targets.\u003c/dd>\n          \u003cdt>\u003cspan class=\"ev int\">interpreted\u003c/span>\u003c/dt>\u003cdd>Industry case not framed as inclusion (D2); its potential for inclusion is our interpretation.\u003c/dd>\n          \u003cdt>\u003cspan class=\"ev ins\">inspiration · no inclusion goal\u003c/span>\u003c/dt>\u003cdd>Industry case aimed at sector literacy or service access (B/C); use as inspiration only.\u003c/dd>\n          \u003cdt>\u003cspan class=\"ev pro\">proposed · …\u003c/span>\u003c/dt>\u003cdd>Academic paper; the second word shows how far it got: review, theoretical, designed, system-tested, evaluated or user-tested.\u003c/dd>\n        \u003c/dl>\u003cp class=\"note\">Click a card to see its source, the barriers and populations it reaches, and any reported outcome.\u003c/p>\u003c/div>\n        \u003cdiv class=\"cards\" id=\"cards\">\u003c/div>\n        \u003cdiv class=\"pager\" id=\"pager\">\u003cbutton class=\"pg\" id=\"pgPrev\" aria-label=\"Previous applications\">‹\u003c/button>\u003cspan class=\"pgc\" id=\"pgCount\" aria-live=\"polite\">\u003c/span>\u003cbutton class=\"pg\" id=\"pgNext\" aria-label=\"Next applications\">›\u003c/button>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"el\">\n        \u003cdiv>\u003ch3 class=\"sh\">Evidence\u003c/h3>\u003cp class=\"evnote\">Outcomes refer to the whole service or study, not to this capability alone.\u003c/p>\u003cdiv id=\"evid\">\u003c/div>\u003c/div>\n        \u003cdiv>\u003ch3 class=\"sh\">Limitations and risks\u003c/h3>\u003cdiv id=\"lims\">\u003c/div>\u003c/div>\n      \u003c/div>\n\n\n    \u003c/div>\n  \u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cdiv class=\"modal-bg\" id=\"fbg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ft\">\u003cform class=\"modal nform\" id=\"nform\" novalidate>\n  \u003cbutton class=\"x\" type=\"button\" id=\"fx\" aria-label=\"Close\">×\u003c/button>\n  \u003ch4 id=\"ft\">New capability\u003c/h4>\n  \u003cp class=\"fhint\">Add a GenAI capability that is not in the library yet. It stays marked as added by your team and is not counted in the research data.\u003c/p>\n  \u003clabel>\u003cspan>Name \u003cspan class=\"req\">*\u003c/span>\u003c/span>\u003cinput name=\"name\" required maxlength=\"60\" placeholder=\"e.g. Proactive notifications\">\u003c/label>\n  \u003clabel>\u003cspan>Description\u003c/span>\u003ctextarea name=\"desc\" rows=\"3\" placeholder=\"What does the AI do, and how does it differ from the existing capabilities?\">\u003c/textarea>\u003c/label>\n  \u003cfieldset>\u003clegend>Example application \u003cspan class=\"opt\">(optional)\u003c/span>\u003c/legend>\n    \u003clabel>\u003cspan>What it does\u003c/span>\u003cinput name=\"app\" placeholder=\"e.g. Reminds users of deadlines by SMS\">\u003c/label>\n    \u003cdiv class=\"frow\">\u003clabel>\u003cspan>Source\u003c/span>\u003cinput name=\"src\" placeholder=\"Organisation, service or paper\">\u003c/label>\n    \u003clabel>\u003cspan>Sector\u003c/span>\u003cselect name=\"sector\">\u003coption>Finance\u003c/option>\u003coption>Public\u003c/option>\u003coption>Healthcare\u003c/option>\u003coption selected>Other\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n  \u003c/fieldset>\n  \u003clabel>\u003cspan>Evidence \u003cspan class=\"opt\">(optional)\u003c/span>\u003c/span>\u003cinput name=\"ev\" placeholder=\"Any reported outcome, and where it comes from\">\u003c/label>\n  \u003clabel>\u003cspan>Limitations and risks \u003cspan class=\"opt\">(optional)\u003c/span>\u003c/span>\u003cinput name=\"lim\" placeholder=\"What could go wrong, or for whom\">\u003c/label>\n  \u003cp class=\"ferr\" id=\"ferr\" role=\"alert\">\u003c/p>\n  \u003cdiv class=\"factions\">\u003cbutton type=\"button\" class=\"fcancel\" id=\"fcancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"mlink fsave\">Save capability\u003c/button>\u003c/div>\n\u003c/form>\u003c/div>\n\u003cdiv class=\"modal-bg\" id=\"mbg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mt\">\u003cdiv class=\"modal\" id=\"modal\">\u003c/div>\u003c/div>\n\u003cscript>\n/* ======================= DATA =======================\n   One object per capability. Edit content here; layout and style\n   are shared by all capabilities. */\nconst CAPS = [{\"id\": \"Multimodal input\", \"name\": \"Multimodal inpu ilter = 'all';\n\nfunction renderGrid(){\n  $('#grid').innerHTML = CAPS.map((c, i) => {\n    const n = c.counts[sector];\n    const dim = !c.user && n[0] + n[1] === 0 ? ' dim' : '';\n    return `\u003cdiv class=\"tile${c.slrOnly ? ' slr' : ''}${c.user ? ' user' : ''}${i === current ? ' on' : ''}${dim}${added.has(c.id) ? ' added' : ''}\" data-i=\"${i}\">${esc(c.name)}${added.has(c.id) ? '\u003cspan class=\"inm\" title=\"In your matrix\">✓\u003c/span>' : ''}\u003csmall>${c.user ? 'Added by\u003cbr>your team' : plural(n[0],'case') + '\u003cbr>' + plural(n[1],'paper')}\u003c/small>\u003c/div>`;\n  }).join('') + `\u003cbutton class=\"tile newcap\" id=\"newCap\" type=\"button\">\u003cspan class=\"plus\" aria-hidden=\"true\">+\u003c/span>New capability\u003c/button>`;\n  $('#newCap').addEventListener('click', () => openForm());\n  document.querySelectorAll('.tile[data-i]').forEach(t => t.addEventListener('click', () => { current = +t.dataset.i; renderGrid(); renderPanel(); }));\n}\n\nfunction bar(parts){ // parts: [[value, colour]]\n  const tot = parts.reduce((a, p) => a + p[0], 0);\n  return `\u003cdiv class=\"sb\">${parts.filter(p => p[0]).map(p => `\u003cdiv style=\"width:${p[0] / tot * 100}%;background:${p[1]}\">\u003c/div>`).join('')}\u003c/div>`;\n}\nfunction legend(parts){ return `\u003cdiv class=\"leg\">${parts.map(p => `\u003cspan>\u003ci style=\"background:${p[1]}\">\u003c/i>${p[2]} ${p[0]}\u003c/span>`).join('')}\u003c/div>`; }\n\nconst SEC = {'var(--olive)': 'finance', 'var(--violet)': 'government', 'var(--orange)': 'healthcare', 'var(--grey)': 'nonspecified', '#B08A5A': 'slrother'};\nfunction secClass(col){ return 'sec-' + (SEC[col] || 'other'); }\nfunction devBar(evl){ // matrix SLR development bar: proposed / designed / system-tested / user-tested\n  const n = /user-tested|evaluated/.test(evl) ? 4 : /system-tested/.test(evl) ? 3 : /designed/.test(evl) ? 2 : 1;\n  return `\u003cspan class=\"dev-bar\" title=\"Development level ${n} of 4\">${[1,2,3,4].map(i => `\u003ci class=\"${i \u003c= n ? 'f' : ''}\">\u003c/i>`).join('')}\u003c/span>`;\n}\nfunction renderPanel(){\n  const c = CAPS[current];\n  syncAdd(c);\n  $('#capname').textContent = c.name;\n  $('#desc').textContent = c.desc;\n  const s = c.stats;\n  $('#useredit').hidden = !c.user;\n  $('#stats').innerHTML = c.user ? `\u003cdiv class=\"stat ustat\">Added by your team · not part of the research data\u003c/div>` :\n    `\u003cdiv class=\"stat\">\u003cb>${s.cases}\u003c/b> case ${s.cases === 1 ? 'study' : 'studies'}\u003c/div>` +\n    `\u003cdiv class=\"stat\">\u003cb>${s.papers}\u003c/b> ${s.papers === 1 ? 'paper' : 'papers'}\u003c/div>` +\n    `\u003cdiv class=\"stat\">\u003cb>${s.d1}\u003c/b> explicitly for digital inclusion (D1)\u003c/div>` +\n    `\u003cdiv class=\"stat\">\u003cb>${s.userTested}\u003c/b> ${s.userTested === 1 ? 'paper' : 'papers'} tested with users\u003c/div>`;\n\n  // applications\n  const nInd = c.cards.filter(k => k.src === 'ind').length, nLit = c.cards.filter(k => k.src === 'lit').length;\n  const btns = document.querySelectorAll('#appf button');\n  btns[0].querySelector('span').textContent = `(${c.cards.length})`;\n  btns[1].querySelector('span').textContent = `(${nInd})`;\n  btns[2].querySelector('span').textContent = `(${nLit})`;\n  $('#cards').innerHTML = c.cards.length ? c.cards.map((k, i) =>\n    `\u003cdiv class=\"card\" data-src=\"${k.src}\" data-k=\"${i}\" tabindex=\"0\" role=\"button\">\u003cdiv class=\"top\">\u003cp>${esc(k.text)}\u003c/p>\u003c/div>\u003cdiv class=\"chips\">\u003cspan class=\"chip ${secClass(k.col)}\" style=\"background:${k.col}\">${esc(k.who)}\u003c/span>\u003cspan class=\"ev ${k.ev}\">${esc(k.evl)}\u003c/span>\u003c/div>${k.src === 'lit' ? devBar(k.evl) : ''}\u003c/div>`\n  ).join('') : '\u003cp class=\"empty\">No applications described in the sources.\u003c/p>';\n  document.querySelectorAll('#cards .card').forEach(el => { const open = () => openCard(c, c.cards[+el.dataset.k]); el.addEventListener('click', open); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }); });\n  applyAppFilter();\n\n  // analytics\n  const w = v => Math.min(100, v); // bar length = percentage of 100%\n  $('#a-share').innerHTML =\n    `\u003cdiv class=\"share2\">\u003cdiv class=\"sh2l\">\u003cspan>Industry\u003c/span>\u003cb>${c.share.ind}%\u003c/b>\u003c/div>\u003cdiv class=\"track\">\u003cdiv style=\"width:${w(c.share.ind)}%;background:#6A2A7C\">\u003c/div>\u003c/div>\u003c/div>` +\n    `\u003cdiv class=\"share2\">\u003cdiv class=\"sh2l\">\u003cspan>Literature\u003c/span>\u003cb>${c.share.lit}%\u003c/b>\u003c/div>\u003cdiv class=\"track\">\u003cdiv style=\"width:${w(c.share.lit)}%;background:#7E8B3E\">\u003c/div>\u003c/div>\u003c/div>` +\n    `\u003cdiv class=\"scale\">\u003cspan>0%\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\u003cdiv class=\"note\">Share of all capability occurrences (D1+D2 cases; SLR papers)\u003c/div>`;\n  const sec = [[c.sector.Finance, 'var(--olive)', 'Finance'], [c.sector.Public, 'var(--violet)', 'Public'], [c.sector.Healthcare, 'var(--orange)', 'Healthcare']];\n  $('#a-sector').innerHTML = s.cases ? bar(sec) + legend(sec) : `\u003cp class=\"empty\">No case studies: literature only.\u003c/p>`;\n  const ev = [[c.evtype.D1, '#62127A', 'D1 reported'], [c.evtype.D2, '#b48ccf', 'D2 interpreted'], [c.evtype.BC, '#e3d3ea', 'B/C no inclusion goal']];\n  $('#a-ev').innerHTML = s.cases ? bar(ev) + legend(ev) : `\u003cp class=\"empty\">No case studies: literature only.\u003c/p>`;\n\n  if (c.user) {\n    ['#a-share', '#a-sector', '#a-ev'].forEach(id => $(id).innerHTML = `\u003cp class=\"empty\">No library data for capabilities added by your team.\u003c/p>`);\n  }\n  $('#asum').textContent = c.user ? 'no library data' : `Industry ${c.share.ind}% · Literature ${c.share.lit}%` + (s.cases ? ` · ${c.evtype.D1} of ${s.cases} cases explicitly for inclusion` : ' · literature only');\n\n  // evidence + limitations\n  const li = a => `\u003cul class=\"pl\">${a.map(e => `\u003cli>\u003cb>${esc(e.who)}\u003c/b> · ${esc(e.short || e.text)}\u003c/li>`).join('')}\u003c/ul>`;\n  $('#evid').innerHTML = c.user ? (c.evNote ? `\u003cul class=\"pl\">\u003cli>${esc(c.evNote)}\u003c/li>\u003c/ul>` : `\u003cp class=\"empty\">No evidence added yet.\u003c/p>`) :\n    `\u003cdiv class=\"evsub\">For digital inclusion\u003c/div>` + (c.evInc.length ? li(c.evInc) : `\u003cp class=\"empty\">No inclusion outcomes reported.\u003c/p>`) +\n    (c.evSvc.length ? `\u003cdiv class=\"evsub\">Service performance \u003csmall>· no inclusion goal stated\u003c/small>\u003c/div>` + li(c.evSvc) : '');\n  const split = l => { const m = l.match(/^(.*)\\s\\(([^()]*\\d{4}|[^()]*benchmark)\\)$/); return m ? [m[1], m[2]] : [l, '']; };\n  $('#lims').innerHTML = c.limits.length ? `\u003cul class=\"pl\">${c.limits.map(l => { const [a, b] = split(l); return `\u003cli>${esc(a)}${b ? `\u003cspan class=\"src\">${esc(b)}\u003c/span>` : ''}\u003c/li>`; }).join('')}\u003c/ul>`\n                                         : `\u003cp class=\"empty\">No limitations reported in the linked sources.\u003c/p>`;\n  $('#gomx').dataset.capability = c.id; // hook for the prototype: open the matrix filtered on this capability\n}\n\n/* Add to matrix: marks the capability as selected for the user's Digital Inclusion Matrix.\n   The prototype listens to 'library:capability' (same window) or the postMessage (iframe). */\nfunction syncAdd(c){\n  const on = added.has(c.id), b = $('#addBtn');\n  b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);\n  b.textContent = on ? '✓ Added to matrix' : '+ Add to matrix';\n}\nlet toastT;\nfunction toast(html){ const el = $('#toast'); el.innerHTML = html; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3500); }\n$('#addBtn').addEventListener('click', () => {\n  const c = CAPS[current], on = !added.has(c.id);\n  on ? added.add(c.id) : added.delete(c.id);\n  syncAdd(c); renderGrid();\n  const detail = {id: c.id, name: c.name, added: on, selection: [...added]};\n  window.dispatchEvent(new CustomEvent('library:capability', {detail}));\n  if (window.parent !== window) window.parent.postMessage({type: 'library:capability', ...detail}, '*');\n  toast(on ? `\u003cb>${esc(c.name)}\u003c/b> added to the Digital Inclusion Matrix \u003ca class=\"tlink\" id=\"tgo\">Go to matrix →\u003c/a>`\n           : `\u003cb>${esc(c.name)}\u003c/b> removed from the Digital Inclusion Matrix`);\n});\n\n$('#accBtn').addEventListener('click', () => {\n  const open = $('#accBtn').getAttribute('aria-expanded') !== 'true';\n  $('#accBtn').setAttribute('aria-expanded', open); $('#arow').hidden = !open;\n});\n\n/* ===== New capability (added by the team) ===== */\nconst STORE = 'capLibrary.userCaps';\nfunction loadUser(){ try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { return []; } }\nfunction saveUser(){ try { localStorage.setItem(STORE, JSON.stringify(CAPS.filter(c => c.user).map(c => c.raw))); } catch (e) {} }\nconst SECOL = {Finance: 'var(--olive)', Public: 'var(--violet)', Healthcare: 'var(--orange)', Other: '#B08A5A'};\nfunction makeUserCap(r){\n  const zero = {all: [0, 0], Finance: [0, 0], Public: [0, 0], Healthcare: [0, 0]};\n  const cards = r.app ? [{src: 'usr', text: r.app, who: r.src || 'Added by your team', col: SECOL[r.sector] || '#B08A5A', ev: 'usr', evl: 'added by your team',\n    d: {type: 'Team addition', source: r.src || '–', sector: r.sector, category: 'Added by your team', stage: '–', barriers: [], populations: [], outcome: r.ev || '', url: ''}}] : [];\n  return {id: r.id, user: true, raw: r, name: r.name, desc: r.desc || 'No description yet.', counts: zero,\n    stats: {cases: 0, papers: 0, d1: 0, userTested: 0}, share: {ind: 0, lit: 0}, sector: {Finance: 0, Public: 0, Healthcare: 0},\n    evtype: {D1: 0, D2: 0, BC: 0}, cards, evidence: [], evInc: [], evSvc: [], evNote: r.ev || '', limits: r.lim ? [r.lim] : []};\n}\nloadUser().forEach(r => CAPS.push(makeUserCap(r)));\n\nlet editing = null;\nfunction openForm(c){\n  editing = c || null; const f = $('#nform'); f.reset(); $('#ferr').textContent = '';\n  $('#ft').textContent = c ? 'Edit capability' : 'New capability';\n  if (c) Object.entries(c.raw).forEach(([k, v]) => { if (f.elements[k]) f.elements[k].value = v; });\n  $('#fbg').classList.add('open'); f.elements.name.focus();\n}\nfunction closeForm(){ $('#fbg').classList.remove('open'); }\n$('#fx').addEventListener('click', closeForm); $('#fcancel').addEventListener('click', closeForm);\n$('#fbg').addEventListener('click', e => { if (e.target.id === 'fbg') closeForm(); });\n$('#nform').addEventListener('submit', e => {\n  e.preventDefault();\n  const f = e.target, r = Object.fromEntries(['name', 'desc', 'app', 'src', 'sector', 'ev', 'lim'].map(k => [k, f.elements[k].value.trim()]));\n  if (!r.name) { $('#ferr').textContent = 'Please give the capability a name.'; f.elements.name.focus(); return; }\n  if (CAPS.some(c => c.name.toLowerCase() === r.name.toLowerCase() && c !== editing)) { $('#ferr').textContent = 'A capability with this name already exists.'; return; }\n  r.id = editing ? editing.raw.id : 'user-' + Date.now();\n  const cap = makeUserCap(r);\n  if (editing) { const i = CAPS.indexOf(editing); added.delete(editing.id); CAPS[i] = cap; current = i; }\n  else { CAPS.push(cap); current = CAPS.length - 1; }\n  saveUser(); closeForm(); renderGrid(); renderPanel();\n  const detail = {id: cap.id, name: cap.name, data: r, edited: !!editing};\n  window.dispatchEvent(new CustomEvent('library:new-capability', {detail}));\n  if (window.parent !== window) window.parent.postMessage({type: 'library:new-capability', ...detail}, '*');\n  toast(`\u003cb>${esc(cap.name)}\u003c/b> ${editing ? 'updated' : 'added to the library'}`);\n  $('#grid').querySelector('.tile.on')?.scrollIntoView({block: 'nearest'});\n});\n$('#editCap').addEventListener('click', () => openForm(CAPS[current]));\n$('#delCap').addEventListener('click', () => {\n  const c = CAPS[current]; if (!c.user) return;\n  CAPS.splice(current, 1); added.delete(c.id); current = 0; saveUser(); renderGrid(); renderPanel();\n  toast(`\u003cb>${esc(c.name)}\u003c/b> deleted from the library`);\n});\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });\n\nfunction openCard(c, k){\n  const p = CASES[k.key];\n  if (!p) return openCardOld(c, k);\n  const list = a => a.length ? `\u003cul>${a.map(x => `\u003cli>${esc(x)}\u003c/li>`).join('')}\u003c/ul>` : '–';\n  const capChips = p.caps.map(i => `\u003cbutton type=\"button\" class=\"capchip${CAPS[i] === c ? ' cur' : ''}\" data-ci=\"${i}\"${CAPS[i] === c ? ' aria-current=\"true\"' : ''}>${esc(CAPS[i].name)}\u003c/button>`).join('');\n  $('#modal').innerHTML = `\u003cbutton class=\"x\" id=\"mx\" aria-label=\"Close\">×\u003c/button>\n    \u003cdiv class=\"ptype\">${p.src === 'ind' ? 'Case study' : 'Paper ' + esc(p.num)}\u003c/div>\n    \u003ch4 id=\"mt\">${esc(p.name)}\u003c/h4>\n    \u003cdiv class=\"chips\">\u003cspan class=\"chip ${secClass(p.col)}\" style=\"background:${p.col}\">${esc(p.sector)}\u003c/span>\u003cspan class=\"ev ${p.ev}\">${esc(p.evl)}\u003c/span>\u003c/div>\n    ${p.about ? `\u003cp class=\"about\">${esc(p.about)}\u003c/p>` : ''}\n    \u003cdiv class=\"here\">\u003cspan class=\"hl\">In ${esc(c.name)}\u003c/span>${esc(k.text)}\u003c/div>\n    \u003cdl>\n      \u003cdt>Capabilities used\u003c/dt>\u003cdd class=\"capchips\">${capChips}\u003c/dd>\n      \u003cdt>${p.catLabel}\u003c/dt>\u003cdd>${esc(p.cat)}\u003c/dd>\n      \u003cdt>Stages of access\u003c/dt>\u003cdd>${p.stages.length ? esc(p.stages.join(', ')) : '–'}\u003c/dd>\n      \u003cdt>Barriers reached\u003c/dt>\u003cdd>${list(p.barriers)}\u003c/dd>\n      \u003cdt>Populations reached\u003c/dt>\u003cdd>${list(p.populations)}\u003c/dd>\n      ${p.outcome ? `\u003cdt>Outcome\u003c/dt>\u003cdd>${esc(p.outcome)}\u003cspan class=\"onote\">For the ${p.src === 'ind' ? 'whole service' : 'whole study'}, not for one capability alone.\u003c/span>\u003c/dd>` : ''}\n      \u003cdt>Source\u003c/dt>\u003cdd>${p.url ? `\u003ca href=\"${p.url}\" target=\"_blank\" rel=\"noopener\">${esc(p.source)} ↗\u003c/a>` : esc(p.source)}\u003c/dd>\n    \u003c/dl>\n    \u003ca class=\"mlink\" id=\"mxShow\">Show in Digital Inclusion Matrix →\u003c/a>`;\n  $('#modal').querySelectorAll('.capchip').forEach(b => b.addEventListener('click', () => {\n    const i = +b.dataset.ci; if (CAPS[i] === c) return;\n    closeCard(); current = i; renderGrid(); renderPanel();\n  }));\n  $('#mxShow').addEventListener('click', () => { closeCard(); goMatrix(c); });\n  $('#mbg').classList.add('open'); $('#mx').focus();\n  $('#mx').addEventListener('click', closeCard);\n}\nfunction openCardOld(c, k){\n  const d = k.d, list = a => a.length ? `\u003cul>${a.map(x => `\u003cli>${esc(x)}\u003c/li>`).join('')}\u003c/ul>` : '–';\n  $('#modal').innerHTML = `\u003cbutton class=\"x\" id=\"mx\" aria-label=\"Close\">×\u003c/button>\n    \u003ch4 id=\"mt\">${esc(k.text)}\u003c/h4>\n    \u003cdiv class=\"chips\">\u003cspan class=\"chip\" style=\"background:${k.col}\">${esc(k.who)}\u003c/span>\u003cspan class=\"ev ${k.ev}\">${esc(k.evl)}\u003c/span>\u003c/div>\n    \u003cdl>\n      \u003cdt>Capability\u003c/dt>\u003cdd>${esc(c.name)}\u003c/dd>\n      \u003cdt>Source\u003c/dt>\u003cdd>${d.url ? `\u003ca href=\"${d.url}\" target=\"_blank\" rel=\"noopener\">${esc(d.source)} ↗\u003c/a>` : esc(d.source)}\u003c/dd>\n      \u003cdt>Sector\u003c/dt>\u003cdd>${esc(d.sector)}\u003c/dd>\n      \u003cdt>${k.src === 'ind' ? 'Category' : 'Evidence'}\u003c/dt>\u003cdd>${esc(d.category.replace('Development level: ', ''))}\u003c/dd>\n      \u003cdt>Stage of access\u003c/dt>\u003cdd>${esc(d.stage)}\u003c/dd>\n      \u003cdt>Barriers reached\u003c/dt>\u003cdd>${list(d.barriers)}\u003c/dd>\n      \u003cdt>Populations reached\u003c/dt>\u003cdd>${list(d.populations)}\u003c/dd>\n      ${d.outcome ? `\u003cdt>Reported outcome\u003c/dt>\u003cdd>${esc(d.outcome)}\u003c/dd>` : ''}\n    \u003c/dl>\n    \u003ca class=\"mlink\" id=\"mxShow\">Show in Digital Inclusion Matrix →\u003c/a>`;\n  $('#mxShow').addEventListener('click', () => { closeCard(); goMatrix(c); });\n  $('#mbg').classList.add('open'); $('#mx').focus();\n  $('#mx').addEventListener('click', closeCard);\n}\nfunction goMatrix(c){\n  const detail = {id: c.id, name: c.name};\n  window.dispatchEvent(new CustomEvent('library:go-matrix', {detail}));\n  if (window.parent !== window) window.parent.postMessage({type: 'library:go-matrix', ...detail}, '*');\n}\n$('#gomx').addEventListener('click', () => goMatrix(CAPS[current]));\ndocument.addEventListener('click', e => { if (e.target && e.target.id === 'tgo') goMatrix(CAPS[current]); });\nfunction closeCard(){ $('#mbg').classList.remove('open'); }\n$('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg') closeCard(); });\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });\n$('#infoBtn').addEventListener('click', () => { const o = $('#key').classList.toggle('open'); $('#infoBtn').setAttribute('aria-expanded', o); });\n\nfunction applyAppFilter(){\n  document.querySelectorAll('#appf button').forEach(x => x.classList.toggle('on', x.dataset.f === appFilter));\n  document.querySelectorAll('#cards .card').forEach(k => k.style.display = (appFilter === 'all' || k.dataset.src === appFilter) ? '' : 'none');\n  $('#cards').scrollLeft = 0;\n  requestAnimationFrame(() => updBar(true));\n}\ndocument.querySelectorAll('#appf button').forEach(b => b.addEventListener('click', () => { appFilter = b.dataset.f; applyAppFilter(); }));\ndocument.querySelectorAll('.sect button').forEach(b => b.addEventListener('click', () => {\n  sector = b.dataset.s;\n  document.querySelectorAll('.sect button').forEach(x => x.classList.toggle('on', x === b));\n  renderGrid();\n}));\n\n/* pager for the application cards (no horizontal scrolling) */\nc   // GenAI risk cards (standalone page, source: risk_cards.html): flip cards, grid or one-by-one (shuffle) view
  var RISK_HTML = "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>GenAI Risk Cards\u003c/title>\n\u003cstyle>\n  :root{\n    --ink:#241a30; --dim:#726480; --line:#e4dfeb;\n    --risk:#9d174d; --risk-soft:rgba(157,23,77,.08); --risk-mid:rgba(157,23,77,.35);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;height:100%;}\n  body{font:13px/1.4 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);\n    background-color:#fff;background-image:radial-gradient(rgba(36,26,48,.07) 1px,transparent 1px);background-size:22px 22px;\n    display:flex;flex-direction:column;}\n\n  /* top bar */\n  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px 14px;}\n  .bar .ttl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}\n  .bar .sub{font-size:12px;color:var(--dim);font-style:italic;margin-top:3px;}\n  .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}\n  .pill{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;border:1px solid var(--line);\n    background:#fff;color:var(--ink);cursor:pointer;}\n  .pill:hover{border-color:var(--risk-mid);background:var(--risk-soft);}\n  .pill[aria-pressed=\"true\"]{background:var(--risk);border-color:var(--risk);color:#fff;}\n  .btn{font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:6px 12px;border-radius:7px;\n    border:1px solid var(--risk-mid);background:transparent;color:var(--risk);cursor:pointer;}\n  .btn:hover:not(:disabled){background:var(--risk-soft);}\n  .btn:disabled{opacity:.4;cursor:default;}\n  .btn[hidden]{display:none;}\n  .sep{width:1px;height:22px;background:var(--line);margin:0 4px;}\n  :focus-visible{outline:2px solid var(--risk);outline-offset:2px;}\n\n  .stage{flex:1 1 ck p.why{color:#4a3d57;}\n  .back .ask{margin:0;font-size:12.5px;line-height:1.45;font-style:italic;color:var(--risk);padding-left:9px;border-left:1px solid var(--risk);}\n  .back p.src{margin-top:auto;padding-top:10px;font-size:10.5px;line-height:1.45;color:var(--dim);font-style:italic;}\n  .back p.src b{font-style:normal;font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-right:3px;}\n\n  /* one by one */\n  .single{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px;}\n  .single .card{width:min(440px,100%);height:540px;}\n  .single .front h3{font-size:28px;}\n  .single .front .rule{width:36px;margin-top:18px;}\n  .single .back{padding:22px 24px 18px;}\n  .single .back .head h4{font-size:16px;}\n  .single .lbl{font-size:11px;margin:14px 0 5px;}\n  .single .back p{font-size:14px;}\n  .single .back .ask{font-size:15px;}\n  .single .back p.src{font-size:12px;}\n  .nav{display:flex;align-items:center;gap:12px;}\n  .round{width:32px;height:32px;border-radius:50%;border:1px solid var(--risk-mid);background:#fff;color:var(--risk);font-size:16px;cursor:pointer;}\n  .round:hover:not(:disabled){background:var(--risk-soft);}\n  .round:disabled{opacity:.35;cursor:default;}\n  .count{font-size:12px;font-style:italic;color:var(--dim);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"bar\">\n    \u003cdiv>\n      \u003cdiv class=\"ttl\">GenAI risk cards\u003c/div>\n      \u003cdiv class=\"sub\">Risks GenAI poses to digital inclusion. Click a card to flip it.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ctl\">\n      \u003cbutton type=\"button\" class=\"pill\" data-view=\"single\" aria-pressed=\"true\">One by one\u003c/button>\n      \u003cbutton type=\"button\" class=\"pill\" data-view=\"grid\" aria-pressed=\"false\">Grid\u003c/button>\n      \u003cspan class=\"sep\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"shuffleBtn\" title=\"Shuffle the order and start again\">Shuffle\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"resetBtn\" title=\"Turn every card face down\">Turn all face down\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stage\" id=\"stage\">\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  var CARDS = [\n    { t:'Biased training data',\n      risk:'LLMs are trained on data in which excluded populations are underrepresented.',\n      why:'Lower data literacy leads to poorer data, which leads to unrepresentative outputs. This reproduces the same inequalities the data came from.',\n      ask:'Who is missing from the data behind this model?',\n      src:['Moodley, 2024','Al-Bander et al., 2026','Khoshfekr Rudsari et al., 2025','Yusha\u2019u, 2026'] },\n    { t:'Discrimination',\n      risk:'Biased outputs treat some users differently, or less well.',\n      why:'GenAI bias follows existing patterns of social exclusion, and it hits hardest in sensitive services such as healthcare and welfare.',\n      ask:'Could this output disadvantage a group because of who they are?',\n      src:['Moodley, 2024','Karthikeyan et al., 2026'] },\n    { t:'Unequal adoption',\n      risk:'People who are already digitally confident adopt GenAI first, and benefit most.',\n      why:'Adoption follows the existing digital divide: income, education, urban vs rural, gender. This adds a new AI divide on top of it.',\n      ask:'Who will actually use this, and who won\u2019t?',\n      src:['Sumner et al., 2025','Shidende & Mwogosi, 2025','Ahmad et al., 2026','Johnson Sidi Baba et al., 2026','Calzada & Eizaguirre, 2025','Radoji\u010di\u0107 & Vukmirovi\u0107, 2025','Yusha\u2019u, 2026','Capraro et al., 2024'] },\n    { t:'New skill thresholds',\n      risk:'Safe use needs new skills: prompting, checking answers, and knowing enough to judge them.',\n      why:'A barrier is lowered in one place and raised in another, often for the same users.',\n      ask:'What does a user need to know to use this safely?',\n      src:['Radoji\u010di\u0107 & Vukmirovi\u0107, 2025'] },\n    { t:'Skill substitution',\n      risk:'GenAI does the task instead of the user: speaking instead of typing, completing forms on their behalf.',\n      why:'For impairments, this is what makes a service accessible. For missing skills, it creates dependency, and users can\u2019t notice when the system fails.',\n      ask:'Does this build the user\u2019s skills, or replace them? Where does dependency move?',\n      src:['Deodhar et al., 2026','Esposito et al., 2026','Favero et al., 2025','Tepe, 2026','Radoji\u010di\u0107 & Vukmirovi\u0107, 2025','Abdulkareem, 2024'] },\n    { t:'Trust and motivation',\n      risk:'People don\u2019t trust GenAI, or don\u2019t see why they should use it.',\n      why:'Adoption follows perceived usefulness and existing divides. Fear, scepticism and a \u201cblack box\u201d view of technology, and low public trust, keep people away, so GenAI can weaken the motivational stage of access.',\n      ask:'Why would this person want to use it? What would make them trust it?',\n      src:['Johnson Sidi Baba et al., 2026','Yu et al., 2026','Abdulkareem, 2024'] },\n    { t:'Privacy, transparency and safety',\n      risk:'Opaque systems handle sensitive personal data.',\n      why:'Those who understand least how the system works are most exposed to privacy breaches, misinformation, manipulation and surveillance. Enforced consent leaves users no real choice.',\n      ask:'Can users understand what happens with their data, and give real consent?',\n      src:['Moodley, 2024','Karthikeyan et al., 2026','Abdulkareem, 2024'] }\n  ];\n\n  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;'); }\n  function pad(i){ return (i \u003c 9 ? '0' : '') + (i + 1); }\n\n  var stage = document.getElementById('stage');\n  var shuffleBtn = document.getElementById('shuffleBtn');\n  var resetBtn = document.getElementById('resetBtn');\n  var view = 'single';\n  var order = CARDS.map(function(_, i){ return i; });\n  var pos = 0;\n  var flipped = {};          // card index -> true when face up\n\n  function cardEl(i){\n    var c = CARDS[i];\n    var el = document.createElement('div');\n    el.className = 'card' + (flipped[i] ? ' flipped' : '');\n    el.tabIndex = 0;\n    el.setAttribute('role', 'button');\n    el.setAttribute('aria-label', c.t + (flipped[i] ? ' (showing the back)' : ' (click to flip)'));\n    el.innerHTML =\n      '\u003cdiv class=\"inner\">' +\n        '\u003cdiv class=\"face front\">' +\n          '\u003cspan class=\"num\">' + pad(i) + '\u003c/span>\u003cspan class=\"kind\">GenAI risk\u003c/span>' +\n          '\u003cdiv>\u003ch3>' + esc(c.t) + '\u003c/h3>\u003cdiv class=\"rule\">\u003c/div>\u003c/div>' +\n          '\u003cspan class=\"hint\">Click to flip\u003c/span>' +\n        '\u003c/div>' +\n        '\u003cdiv class=\"face back\">' +\n          '\u003cdiv class=\"head\">\u003cspan class=\"num\">' + pad(i) + '\u003c/span>\u003ch4>' + esc(c.t) + '\u003c/h4>\u003c/div>' +\n          '\u003cdiv class=\"lbl\">The risk\u003c/div>\u003cp>' + esc(c.risk) + '\u003c/p>' +\n          '\u003cdiv class=\"lbl\">Why it matters\u003c/div>\u003cp class=\"why\">' + esc(c.why) + '\u003c/p>' +\n          '\u003cdiv class=\"lbl\">Ask yourself\u003c/div>\u003cp class=\"ask\">' + esc(c.ask) + '\u003c/p>' +\n          '\u003cp class=\"src\">\u003cb>Sources\u003c/b> ' + c.src.map(esc).join('; ') + '\u003c/p>' +\n        '\u003c/div>' +\n      '\u003c/div>';\n    function flip(){\n      flipped[i] = !flipped[i];\n      el.classList.toggle('flipped', !!flipped[i]);\n      el.setAttribute('aria-label', c.t + (flipped[i] ? ' (showing the back)' : ' (click to flip)'));\n      syncReset();\n    }\n    el._unflip = function(){ flipped[i] = false; el.classList.remove('flipped'); el.setAttribute('aria-label', c.t + ' (click to flip)'); };\n    el.addEventListener('click', function(e){\n      // let people select text on the back without flipping it straight away\n      if (window.getSelection && String(window.getSelection()).length) return;\n      flip();\n    });\n    el.addEventListener('keydown', function(e){\n      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }\n    });\n    return el;\n  }\n\n  function render(){\n    stage.innerHTML = '';\n    shuffleBtn.hidden = view !== 'single';\n    if (view === 'grid'){\n      var g = document.createElement('div');\n      g.className = 'grid';\n      CARDS.forEach(function(_, i){ g.appendChild(cardEl(i)); });\n      stage.appendChild(g);\n      syncReset(); postHeight();\n      return;\n    }\n    var s = document.createElement('div');\n    s.className = 'single';\n    var card = cardEl(order[pos]);\n    s.appendChild(card);\n    var nav = document.createElement('div');\n    nav.className = 'nav';\n    nav.innerHTML = '\u003cbutton type=\"button\" class=\"round\" data-step=\"-1\" aria-label=\"Previous card\">\u2039\u003c/button>' +\n      '\u003cspan class=\"count\">' + (pos + 1) + ' of ' + order.length + '\u003c/span>' +\n      '\u003cbutton type=\"button\" class=\"round\" data-step=\"1\" aria-label=\"Next card\">\u203a\u003c/button>';\n    var prev = nav.children[0], next = nav.children[2];\n    prev.disabled = pos === 0;\n    next.disabled = pos === order.length - 1;\n    prev.addEventListener('click', function(){ go(-1); });\n    next.addEventListener('click', function(){ go(1); });\n    s.appendChild(nav);\n    stage.appendChild(s);\n    syncReset(); postHeight();\n  }\n  function go(step){\n    var n = pos + step;\n    if (n \u003c 0 || n >= order.length) return;\n    pos = n;\n    render();\n    var c = stage.querySelector('.card'); if (c) c.focus();\n  }\n\n  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(b){\n    b.addEventListener('click', function(){\n      view = b.getAttribute('data-view');\n      Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });\n      render();\n    });\n  });\n  shuffleBtn.addEventListener('click', function(){\n    for (var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }\n    pos = 0; flipped = {};\n    render();\n  });\n  function anyFlipped(){ for (var k in flipped){ if (flipped[k]) return true; } return false; }\n  function syncReset(){ resetBtn.disabled = !anyFlipped(); }\n  resetBtn.addEventListener('click', function(e){\n    e.preventDefault();\n    Array.prototype.forEach.call(stage.querySelectorAll('.card'), function(el){ if (el._unflip) el._unflip(); });\n    flipped = {};\n    syncReset();\n  });\n  // tell the canvas how tall the content is, so the panel can fit the card (one by one) or the grid\n  var bar = document.querySelector('.bar');\n  function postHeight(){\n    var inner = stage.firstElementChild;\n    var h = bar.offsetHeight + (inner ? inner.offsetHeight : 0) + 34;\n    try { parent.postMessage({ type: 'risk:height', height: Math.ceil(h) }, '*'); } catch (err) {}\n  }\n  window.addEventListener('resize', function(){ clearTimeout(postHeight._t); postHeight._t = setTimeout(postHeight, 120); });\n  document.addEventListener('keydown', function(e){\n    if (view !== 'single') return;\n    if (e.key === 'ArrowRight') go(1);\n    else if (e.key === 'ArrowLeft') go(-1);\n  });\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
  var libFrames = [];
  var dmFrames = [];
  function mountDigitalMatrixTool(root){
    var f = document.createElement('iframe');
    f.className = 'dm-frame';
    f.title = 'Digital Inclusion Matrix';
    f.srcdoc = DM_HTML;
    root.appendChild(f);

  }
  // Export from an embedded matrix: the file is handed to this page, which offers it to the viewer.
  window.addEventListener('message', async function(ev){
    var d = ev.data;
    if (!d || typeof d.dmSave !== 'string') return;
    var frame = null;
    dmFrames = dmFrames.filter(function(f){ return document.body.contains(f); });
    dmFrames.forEach(function(f){ if (f.contentWindow === ev.source) frame = f; });
    if (!frame) return;
    function reply(status){ try { ev.source.postMessage({ dmSaveReply: d.dmSave, status: status }, '*'); } catch (e) {} }
    var dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl){
      try { await dl.save({ filename: d.filename, data: d.data }); reply('saved'); }
      catch (e) { reply(e && e.code === 'declined' ? 'declined' : ((e && (e.code || e.message)) || 'unknown')); }
      return;
    }

  // ================= Activity content =================
  // Block types: q = guiding question, instr = lead-in sentence, act = Activity list, sug = Suggestion list,
  // caseStudy = case study box, keywords = numbered keyword prompts (optionally under a head + citation).
  function q(text){ return { type:'question', text:text }; }
  function instr(text){ return { type:'instr', text:text }; }
  function act(items){ return { type:'act', label:'Activity', items:items }; }
  function sug(label, items){ return { type:'sug', label:label, items:items }; }
  function t(text, chips){ return { text:text, chips:chips || null }; }

  // ================= zoom =================
  var zoom = 1;

  var zoomPctBtn = document.getElementById('zoom-pct-btn');
  function setZoom(newZoom, clientX, clientY){
    if (fsState) return;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (Math.abs(newZoom - zoom) < 0.001) return;
    var wrapRect = canvasWrap.getBoundingClientRect();
    var px = (clientX != null ? clientX : wrapRect.left + wrapRect.width/2) - wrapRect.left;
    var py = (clientY != null ? clientY : wrapRect.top + wrapRect.height/2) - wrapRect.top;
    // the local (unscaled) board point currently sitting under (px,py) — keep it there after zooming
    var localX = (canvasWrap.scrollLeft + px) / zoom;
    var localY = (canvasWrap.scrollTop + py) / zoom;
    zoom = newZoom;
    board.style.transform = 'scale(' + zoom + ')';
    updateLayout();
    canvasWrap.scrollLeft = localX*zoom - px;
    canvasWrap.scrollTop = localY*zoom - py;
    zoomPctBtn.textContent = Math.round(zoom*100) + '%';
  }
  document.getElementById('zoom-in-btn').addEventListener('click', function(){ setZoom(zoom*1.08); });
  document.getElementById('zoom-out-btn').addEventListener('click', function(){ setZoom(zoom/1.08); });

  canvasWrap.addEventListener('wheel', function(e){

  // ================= dragging (shared by activity nodes and spawned nodes) =================
  // All math below is in the board's own LOCAL (unscaled) coordinate system — the same
  // system style.left/top are set in. getBoundingClientRect() always returns the current
  // ON-SCREEN (zoom-scaled) box, so every screen measurement is divided by `zoom` to convert
  // it back to local units before it's compared against or written into style.left/top.
  function makeDraggable(el, handleEl){
    var dragging = false, offX = 0, offY = 0;
    handleEl.addEventListener('mousedown', function(e){
      if (e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) return;
      if (el.classList.contains('fullscreen')) return;
      dragging = true;
      document.body.classList.add('node-dragging');
      var boardRect = board.getBoundingClientRect();
      var elLeft = parseFloat(el.style.left) || 0;
      var elTop = parseFloat(el.style.top) || 0;
      offX = (e.clientX - boardRect.left)/zoom - elLeft;
      offY = (e.clientY - boardRect.top)/zoom - elTop;
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
    function onMove(e){
      if (!dragging) return;
      var boardRect = board.getBoundingClientRect();
      var x = (e.clientX - boardRect.left)/zoom - offX;
      var y = (e.clientY - boardRect.top)/zoom - offY;
      x = Math.max(0, x); y = Math.max(0, y);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      updateLayout();
    }
    function onUp(){
      dragging = false;
      document.body.classList.remove('node-dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
  }

  // ================= layout: board sizing + outer connector lines =================
  // ================= resizing panels =================
  // Every panel gets a right-edge handle (width) and bottom-left / bottom-right corner handles (width and height).
  // Text reflows, images and the embedded matrix follow the new size; once a panel has been given a height its
  // content scrolls inside it. Panels stacked below it in the same column, and the ones attached to its right
  // at the fixed 90 px distance, move with it so the gaps stay the same.
  function addResizeHandles(){
    Array.prototype.forEach.call(board.querySelectorAll('.node'), function(n){
      if (n.querySelector(':scope > .rz')) return;
      ['e', 'se', 'sw'].forEach(function(m){
        var h = document.createElement('div');
        h.className = 'rz rz-' + m;
        h.title = m === 'e' ? 'Drag to change the width' : 'Drag to change the size';
        h.addEventListener('mousedown', function(e){ startResize(e, n, m); });
        n.appendChild(h);
      });
    });
  }
  function startResize(e, node, mode){
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    var sx = e.clientX, sy = e.clientY, w0 = node.offsetWidth, h0 = node.offsetHeight;
    var l0 = parseFloat(node.style.left) || 0, t0 = parseFloat(node.style.top) || 0;
    var minW = node.classList.contains('tool-node') ? 560 : 240;
    var head = node.querySelector('.node-head'), minH = (head ? head.offsetHeight : 40) + 60;
    var lastW = w0, lastH = h0;
    document.body.classList.add('node-dragging', 'node-resizing');
    function others(fn){ Array.prototype.forEach.call(board.querySelectorAll('.node'), function(n){ if (n !== node) fn(n, parseFloat(n.style.left) || 0, parseFloat(n.style.top) || 0); }); }
    function onMove(ev){
      var dx = (ev.clientX - sx) / zoom, dy = (ev.clientY - sy) / zoom;
      var right0 = (parseFloat(node.style.left) || 0) + lastW, bottom0 = t0 + lastH;
      var w = mode === 'sw' ? Math.max(minW, w0 - dx) : Math.max(minW, w0 + dx);
      node.style.width = w + 'px';
      node.dataset.userW = '1';
      if (mode === 'sw') node.style.left = Math.max(0, l0 + (w0 - w)) + 'px';
      if (mode !== 'e'){
        node.style.height = Math.max(minH, h0 + dy) + 'px';
        node.classList.add('sized');
      }
      var nw = node.offsetWidth, nh = node.offsetHeight, dw = nw - lastW, dh = nh - lastH;
      if (dw && mode !== 'sw') others(function(n, l, t){ if (Math.abs(l - (right0 + ATTACH_GAP)) <= 1) n.style.left = (l + dw) + 'px'; });
      if (dh) others(function(n, l, t){ if (Math.abs(l - l0) <= 1 && t >= bottom0 - 1) n.style.top = Math.max(0, t + dh) + 'px'; });
      lastW = nw; lastH = nh;
      if (node.classList.contains('blank-node')) node._lastH = nh;
      updateLayout();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('node-dragging', 'node-resizing');
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function updateLayout(){
    addResizeHandles();
    var boardRect = board.getBoundingClientRect();
    var maxRight = 3000, maxBottom = 1800;
    Array.prototype.slice.call(board.querySelectorAll('.node')).forEach(function(n){
      var r = n.getBoundingClientRect();
      maxRight = Math.max(maxRight, (r.right - boardRect.left)/zoom + 200);
      maxBottom = Math.max(maxBottom, (r.bottom - boardRect.top)/zoom + 200);
    });
    board.style.width = maxRight + 'px';
    board.style.height = maxBottom + 'px';

    Array.prototype.slice.call(outerSvg.querySelectorAll('.conn-group')).forEach(function(n){ n.remove(); });
    connections.forEach(function(c){
      if (!document.body.contains(c.fromEl) || !document.body.contains(c.toEl)) return;
      var fr = c.fromEl.getBoundingClientRect();
      var tr = c.toEl.getBoundingClientRect();
      var from = { x: (fr.right - boardRect.left)/zoom, y: (fr.top - boardRect.top)/zoom + fr.height/zoom/2 };
      var to = { x: (tr.left - boardRect.left)/zoom, y: (tr.top - boardRect.top)/zoom + tr.height/zoom/2 };

      var g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','conn-group');
      var d = curve(from.x, from.y, to.x, to.y);
      var hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('class','edge-hit'); hit.setAttribute('d', d);
      g.appendChild(hit);
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','edge'); path.setAttribute('d', d);
      g.appendChild(path);
      var cm = curveMid(from.x, from.y, to.x, to.y), midX = cm.x, midY = cm.y;
      var circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('class','edge-x'); circle.setAttribute('cx', midX); circle.setAttribute('cy', midY); circle.setAttribute('r', 9);
      circle.title = 'Remove this attachment';
      circle.addEventListener('click', function(){ removeSpawnedNode(c.toEl); });
      g.appendChild(circle);
      var label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('class','edge-x-label'); label.setAttribute('x', midX); label.setAttribute('y', midY);
      label.textContent = '×';
      g.appendChild(label);
      outerSvg.appendChild(g);
    });
    outerSvg.setAttribute('width', maxRight);
    outerSvg.setAttribute('height', maxBottom);
  }

  // ================= full-screen tool view =================
  // A tool panel can fill the whole window ('Full screen' in its header); 'Back to canvas' (or Esc) returns to the
  // canvas exactly as it was: same zoom, scroll position and panel position and size. While full screen the canvas
  // zoom is set aside (a scaled canvas cannot hold a panel fixed to the window) and the connector lines are hidden.
  var fsState = null;
  function enterFullscreen(node){
    if (fsState) exitFullscreen();
    fsState = { node: node, sl: canvasWrap.scrollLeft, st: canvasWrap.scrollTop };
    board.style.transform = 'none';
    node.classList.add('fullscreen');
    document.body.classList.add('has-fullscreen');
    var b = node.querySelector('.fs-btn'); if (b){ b.textContent = 'Back to canvas'; b.title = 'Return to the canvas view'; }
  }
  function exitFullscreen(){
    var s = fsState; if (!s) return;
    fsState = null;
    s.node.classList.remove('fullscreen');
    document.body.classList.remove('has-fullscreen');
    var b = s.node.querySelector('.fs-btn'); if (b){ b.textContent = 'Full screen'; b.title = 'Show this tool full screen'; }
    board.style.transform = 'scale(' + zoom + ')';
    updateLayout();
    canvasWrap.scrollLeft = s.sl; canvasWrap.scrollTop = s.st;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && fsState) exitFullscreen(); });

  function removeSpawnedNode(nodeEl){
    if (fsState && fsState.node === nodeEl) exitFullscreen();
    connections = connections.filter(function(c){ return c.toEl !== nodeEl; });
    if (nodeEl && nodeEl.parentNode) nodeEl.parentNode.removeChild(nodeEl);
    updateLayout();
  }

  // ================= attach menu =================
  var openMenuEl = null;
  var openMenuBtn = null;
  function closeAttachMenu(){
    if (openMenuEl && openMenuEl.parentNode) openMenuEl.parentNode.removeChild(openMenuEl);
    if (openMenuBtn) openMenuBtn.classList.remove('has-menu-open');
    openMenuEl = null; openMenuBtn = null;
    document.removeEventListener('mousedown', onOutsideClick, true);
  }
  function onOutsideClick(e){
    if (openMenuEl && !openMenuEl.contains(e.target) && e.target !== openMenuBtn){ closeAttachMenu(); }
  }
  function openAttachMenu(btnEl, opts, section){
    if (openMenuBtn === btnEl){ closeAttachMenu(); return; }
    closeAttachMenu();
    var menu = document.createElement('div');
    menu.className = 'attach-menu';
    var labelEl = document.createElement('div');
    labelEl.className = 'menu-label';
    labelEl.textContent = 'Attach to "'+section.title+'"';
    menu.appendChild(labelEl);
    opts.forEach(function(opt){
      var item = document.createElement('button');
      item.className = 'attach-menu-item' + (opt.built ? '' : ' disabled');
      item.type = 'button';
      item.innerHTML = '<span>'+esc(opt.label)+'</span>' + (opt.built ? '' : '<span class="tag">not built</span>');
      item.addEventListener('click', function(){
        closeAttachMenu();
        if (!opt.built){ toast('"'+opt.label+'" isn\'t built yet.'); return; }
        if (opt.type === 'blank'){ spawnBlankNode(btnEl); }
        else if (opt.key === 'digital-matrix'){ spawnToolNode(btnEl); }
        else if (opt.key === 'digital-inclusion-wheel'){ spawnWheelNode(btnEl); }
        else if (opt.key === 'genai-library'){ spawnLibraryToolNode(btnEl); }
        else if (opt.key === 'risk-cards'){ spawnRiskCardsNode(btnEl); }
      });
      menu.appendChild(item);
    });
    document.body.appendChild(menu);
    var r = btnEl.getBoundingClientRect();
    var menuW = 250;
    var menuH = menu.getBoundingClientRect().height;
    var left = Math.min(r.left, window.innerWidth - menuW - 12);
    var top = (r.bottom + 6 + menuH <= window.innerHeight) ? (r.bottom + 6) : (r.top - menuH - 6);
    top = Math.max(8, Math.min(top, window.innerHeight - menuH - 8));
    menu.style.top = top + 'px';
    menu.style.left = Math.max(8, left) + 'px';
    btnEl.classList.add('has-menu-open');
    openMenuEl = menu; openMenuBtn = btnEl;
    setTimeout(function(){ document.addEventListener('mousedown', onOutsideClick, true); }, 0);
  }

  // ================= spawning nodes =================
  function placeNewNode(anchorEl, w, h){
    var boardRect = board.getBoundingClientRect();
    var ar = anchorEl.getBoundingClientRect();
    var x = (ar.right - boardRect.left)/zoom + 50;
    var y = (ar.top - boardRect.top)/zoom - h/2;
    x = Math.max(20, x); y = Math.max(20, y);

    var existing = Array.prototype.slice.call(board.querySelectorAll('.node')).map(function(n){
      var r = n.getBoundingClientRect();
      return {
        x: (r.left - boardRect.left)/zoom, y: (r.top - boardRect.top)/zoom,
        w: r.width/zoom, h: r.height/zoom
      };
    });
    function overlaps(x,y,w,h){
      return existing.some(function(o){
        return x < o.x+o.w+16 && x+w+16 > o.x && y < o.y+o.h+16 && y+h+16 > o.y;
      });
    }
    var tries = 0;
    while (overlaps(x,y,w,h) && tries < 40){ y += 44; tries++; }
    return { x:x, y:y };
  }

  // Where a tool or blank box attached with an activity's + goes: 90 px to the right of the activity card,
  // its top edge in line with the card's top edge; each further attachment of that activity stacks below the
  // previous one with the same 90 px gap. Attachments dragged out of that column no longer count for the stack.
  var ATTACH_GAP = 90;
  function attachPos(anchorEl){
    var act = anchorEl && anchorEl.closest ? anchorEl.closest('.activity-node') : null;
    if (!act) return null;
    var x = (parseFloat(act.style.left) || 0) + act.offsetWidth + ATTACH_GAP;
    var y = parseFloat(act.style.top) || 0, bottom = null;
    connections.forEach(function(c){
      if (!act.contains(c.fromEl) || !document.body.contains(c.toEl)) return;
      if (Math.abs((parseFloat(c.toEl.style.left) || 0) - x) > 1) return;
      var b = (parseFloat(c.toEl.style.top) || 0) + c.toEl.offsetHeight;
      bottom = bottom === null ? b : Math.max(bottom, b);
    });
    return { x: x, y: bottom === null ? y : bottom + ATTACH_GAP };
  }

  function spawnBlankNode(anchorEl){
    var pos = attachPos(anchorEl) || placeNewNode(anchorEl, 300, 190);
    var node = document.createElement('div');
    node.className = 'node spawned blank-node';
    node.style.left = pos.x + 'px';
    node.style.top = pos.y + 'px';
    node.innerHTML =
      '<div class="node-head">' +
        '<span class="title">Blank box<span class="sub">Write, or attach a document</span></span>' +
        '<button class="remove-node-btn" title="Remove">×</button>' +
      '</div>' +
      '<div class="blank-body">' +
        '<textarea class="free-note" placeholder="Write here…"></textarea>' +
        '<div class="attach-row"><button class="attach-file-btn">+ Attach a file</button>' +
        '<input type="file" class="file-input" multiple hidden /></div>' +
        '<div class="blank-previews"></div>' +
        '<ul class="attached-files"></ul>' +
      '</div>';
    board.appendChild(node);

    var headEl = node.querySelector('.node-head');
    makeDraggable(node, headEl);
    node.querySelector('.remove-node-btn').addEventListener('click', function(){ removeSpawnedNode(node); });

    var fileInput = node.querySelector('.file-input');
    var fileList = node.querySelector('.attached-files');
    node.querySelector('.attach-file-btn').addEventListener('click', function(){ fileInput.click(); });
    // Images are previewed in the box, which takes their format: the preview keeps the image's proportions at a
    // similar size for every shape (wider for landscape, narrower and taller for portrait), and the box is as wide
    // as its widest preview (never narrower than 300 px). Other files are listed by name. Display only: nothing
    // is uploaded or stored.
    var previews = node.querySelector('.blank-previews');
    var PREVIEW_AREA = 330 * 330, BLANK_PAD = 28, BLANK_MIN_W = 300;
    // When the box changes height, the boxes stacked below it in the same column move by the same amount, so the
    // 90 px gap between them stays and nothing ends up covered.
    function fitBlankWidth(){
      var w = BLANK_MIN_W, x = parseFloat(node.style.left) || 0, top = parseFloat(node.style.top) || 0;
      var oldBottom = top + (node._lastH || node.offsetHeight);
      Array.prototype.forEach.call(previews.querySelectorAll('img'), function(im){ w = Math.max(w, (parseFloat(im.dataset.w) || 0) + BLANK_PAD); });
      if (!node.dataset.userW) node.style.width = w + 'px';
      node._lastH = node.offsetHeight;
      var dh = top + node._lastH - oldBottom;
      if (dh){
        Array.prototype.forEach.call(board.querySelectorAll('.node'), function(n){
          if (n === node || Math.abs((parseFloat(n.style.left) || 0) - x) > 1) return;
          var t = parseFloat(n.style.top) || 0;
          if (t >= oldBottom - 1) n.style.top = Math.max(0, t + dh) + 'px';
        });
      }
      updateLayout();
    }
    fileInput.addEventListener('change', function(){
      Array.prototype.slice.call(fileInput.files).forEach(function(f){
        var li = document.createElement('li');
        var span = document.createElement('span');
        span.textContent = f.name;
        span.title = f.name;
        li.appendChild(span);
        var rm = document.createElement('button');
        rm.textContent = '×';
        rm.title = 'Remove (display only — nothing was actually uploaded)';
        var fig = null;
        rm.addEventListener('click', function(){ li.remove(); if (fig) fig.remove(); fitBlankWidth(); });
        li.appendChild(rm);
        fileList.appendChild(li);
        if (/^image\//.test(f.type)){
          fig = document.createElement('img');
          fig.alt = f.name; fig.title = f.name;
          var reader = new FileReader();
          reader.onload = function(){
            fig.onload = function(){
              var r = (fig.naturalWidth || 1) / (fig.naturalHeight || 1);
              var w = Math.round(Math.max(200, Math.min(620, Math.sqrt(PREVIEW_AREA * r))));
              fig.dataset.w = w;
              fitBlankWidth();
            };
            fig.src = reader.result;
          };
          reader.readAsDataURL(f);
          previews.appendChild(fig);
        }
      });
      fileInput.value = '';
      fitBlankWidth();
    });
    node._lastH = node.offsetHeight;

    connections.push({ id: uid('lnk-'), fromEl: anchorEl, toEl: node });
    updateLayout();
  }

  function spawnToolNode(anchorEl, skipConnector, dropPos){

  // ================= GenAI Capabilities Library =================
  // Same approach as the Digital Matrix: the library page runs in its own iframe (own styles, own scroll).

  var librarySelection = [];

  window.addEventListener('message', function(ev){
    var d = ev.data;

      matrix.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'start' });

  // ================= GenAI risk cards =================
