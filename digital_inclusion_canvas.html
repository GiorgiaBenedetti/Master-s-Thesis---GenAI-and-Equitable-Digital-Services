<title>Digital Inclusion Canvas</title>
<style>
  :root{
    --bg:#252525;
    --panel:#141416;
    --panel-2:#1c1c1f;
    --panel-3:#242429;
    --line:rgba(255,255,255,.14);
    --text:#f1edf6;
    --text-dim:#a99fb3;

    --purple-900:#2a1038;
    --purple-700:#7c3aed;
    --purple-500:#a855f7;
    --purple-300:#d8b4fe;
    --purple-100:rgba(168,85,247,.14);

    /* Card/panel chrome (nodes, Library, menus, zoom control) — white, sitting on the
       dark canvas. Kept separate from --panel/--panel-2/--panel-3/--text/--text-dim/--line
       above, which stay as-is because the embedded Digital Matrix's own canvas and cells
       still use them and are meant to stay dark, nested inside these now-white cards. */
    --card-bg:#ffffff;
    --card-bg-2:#f5f2f9;
    --card-line:#e4dfeb;
    --card-ink:#241a30;
    --card-ink-dim:#726480;

    --col-population-bg:#6d28d9;
    --col-population-text:#ffffff;
    --col-barriers-bg:rgba(168,85,247,.12);
    --col-barriers-border:#a855f7;
    --col-barriers-text:#e9d8fd;
    --col-access-bg:#9d174d;
    --col-access-text:#ffffff;
    --col-access-panel:rgba(157,23,77,.14);
    --col-capabilities-bg:rgba(96,165,250,.16);
    --col-capabilities-border:#60a5fa;
    --col-capabilities-text:#dbeafe;
    --ind-government:#a855f7;
    --ind-finance:#a3b535;
    --ind-healthcare:#60a5fa;
    --ind-other:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #canvas-wrap{overflow:auto;height:100vh;position:relative;
    background-color:var(--bg);
    background-image:radial-gradient(#660279 0.8px, transparent 0.8px);
    background-size:24px 24px;}
  #board{position:relative;min-width:3000px;min-height:1800px;transform-origin:0 0;}

  svg#outer-edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:1;}
  #outer-edges path.edge{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-linecap:round;}
  #outer-edges circle.edge-x{fill:var(--panel-2);stroke:var(--purple-500);stroke-width:1.5;cursor:pointer;pointer-events:all;opacity:0;transition:opacity .12s;}
  #outer-edges g.conn-group:hover circle.edge-x, #outer-edges g.conn-group:hover text.edge-x-label{opacity:1;}
  #outer-edges text.edge-x-label{font-size:11px;fill:var(--purple-300);text-anchor:middle;dominant-baseline:middle;pointer-events:none;user-select:none;opacity:0;transition:opacity .12s;}
  #outer-edges path.edge-hit{fill:none;stroke:transparent;stroke-width:14px;pointer-events:stroke;cursor:pointer;}

  .node{position:absolute;z-index:2;background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px;
    overflow:visible;box-shadow:0 8px 28px rgba(0,0,0,.45);}
  .node.activity-node{width:380px;}
  /* resize handles: right edge = width; bottom corners = width and height */
  .rz{position:absolute;z-index:6;}
  .rz-e{top:16px;bottom:16px;right:-6px;width:12px;cursor:ew-resize;}
  .rz-se{right:-7px;bottom:-7px;width:18px;height:18px;cursor:nwse-resize;}
  .rz-sw{left:-7px;bottom:-7px;width:18px;height:18px;cursor:nesw-resize;}
  .rz-se:after,.rz-sw:after{content:'';position:absolute;width:8px;height:8px;bottom:9px;opacity:0;transition:opacity .12s;}
  .rz-se:after{right:9px;border-right:2px solid var(--purple-500);border-bottom:2px solid var(--purple-500);border-bottom-right-radius:4px;}
  .rz-sw:after{left:9px;border-left:2px solid var(--purple-500);border-bottom:2px solid var(--purple-500);border-bottom-left-radius:4px;}
  .node:hover > .rz-se:after,.node:hover > .rz-sw:after{opacity:1;}
  .rz-e:after{content:'';position:absolute;top:50%;right:4px;width:2px;height:28px;margin-top:-14px;border-radius:2px;background:var(--purple-500);opacity:0;transition:opacity .12s;}
  .node:hover > .rz-e:after{opacity:1;}
  body.node-resizing, body.node-resizing *{user-select:none;}
  /* a panel given a height: header and footer stay, the content in between scrolls */
  .node.sized{display:flex;flex-direction:column;}
  .node.sized > *{flex:none;}
  .node.sized > .node-body, .node.sized > .library-body, .node.sized > .info-body, .node.sized > .blank-body{flex:1 1 auto;min-height:0;overflow:auto;}
  .node.sized > .dm-mount{flex:1 1 auto;min-height:0;}
  .node.sized .dm-frame{height:100%;}
  .activity-node .node-head .remove-node-btn{position:absolute;top:10px;right:10px;}

  .node.library-node{width:340px;}
  .library-node .node-head .time{margin-top:3px;line-height:1.4;}

  .node.info-node{width:560px;}
  .info-node .node-head .time{margin-top:3px;line-height:1.4;}
  .info-body{padding:14px 18px 18px;}
  .info-body p{font-size:12.5px;line-height:1.6;margin:0 0 10px;color:var(--card-ink-dim);}
  .info-body p:last-child{margin-bottom:0;}
  .info-body p b{color:var(--purple-700);}
  .info-body p.note{font-size:11.5px;color:var(--card-ink-dim);opacity:.85;font-style:italic;
    line-height:1.6;padding-top:10px;border-top:1px solid var(--card-line);}
  .library-body{padding:12px 14px 14px;display:none;border-top:1px solid var(--card-line);}
  .library-node.open .library-body{display:block;}
  .library-node .node-head{border-bottom:none;}
  .library-node .node-head h2{margin:0;}
  .lib-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 16px;
    background:var(--card-bg);border:none;border-top:1px solid var(--card-line);border-radius:0 0 14px 14px;
    font:inherit;font-size:12.5px;font-weight:700;color:var(--card-ink);cursor:pointer;text-align:left;}
  .lib-toggle:hover{background:var(--purple-100);}
  .lib-toggle .lib-count{font-weight:400;color:var(--card-ink-dim);}
  .lib-toggle .chev{color:var(--purple-700);font-size:12px;transition:transform .15s;}
  .library-node.open .lib-toggle{border-radius:0;}
  .library-node.open .lib-toggle .chev{transform:rotate(180deg);}
  .lib-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:var(--purple-700);margin:14px 0 8px;}
  .lib-label:first-child{margin-top:0;}
  .library-item{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;
    border:1px solid var(--card-line);background:var(--card-bg-2);color:var(--card-ink);cursor:pointer;margin-bottom:8px;}
  .library-item:hover:not(.disabled){background:var(--purple-100);border-color:var(--purple-500);}
  .library-item.disabled{cursor:not-allowed;opacity:.55;}
  .library-item .card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--card-ink);margin-bottom:5px;}
  .library-item.disabled .card-title{color:var(--card-ink-dim);}
  .library-item .card-title .tag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    color:var(--card-ink-dim);flex:none;}
  .library-item .card-desc{font-size:11px;line-height:1.55;color:var(--card-ink-dim);}
  .library-item.dragging{opacity:.4;}

  .drag-ghost{position:fixed;z-index:600;pointer-events:none;background:var(--purple-700);color:#fff;
    font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.5);
    opacity:.92;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;top:0;left:0;}
  .drag-ghost.invalid{background:var(--panel-3);color:var(--text-dim);border:1px dashed var(--text-dim);}

  #zoom-controls{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;align-items:center;gap:2px;
    background:var(--card-bg);border:1px solid var(--card-line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    padding:4px;}
  #zoom-controls button{width:28px;height:28px;border-radius:7px;border:none;background:transparent;
    color:var(--purple-700);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #zoom-controls button:hover{background:var(--purple-100);}
  #zoom-controls .zoom-pct{width:46px;height:28px;border-radius:7px;border:none;background:transparent;
    color:var(--card-ink-dim);font-size:11.5px;cursor:pointer;text-align:center;}
  #zoom-controls .zoom-pct:hover{background:var(--purple-100);color:var(--card-ink);}
  .node-head{padding:14px 16px 12px;border-bottom:1px solid var(--card-line);background:var(--card-bg-2);
    border-radius:14px 14px 0 0;cursor:grab;user-select:none;position:relative;}
  .node-head:active{cursor:grabbing;}
  .node-head .pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    background:var(--purple-700);color:#fff;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .node-head h2{font-size:16px;margin:0 0 3px;color:var(--card-ink);}
  .node-head .time{font-size:11.5px;color:var(--card-ink-dim);}

  .node-body{overflow:visible;}

  .section{border-bottom:1px solid var(--card-line);}
  .section:last-child{border-bottom:none;}
  .section-head{width:100%;display:flex;align-items:center;gap:8px;
    padding:11px 12px 11px 16px;background:none;border:none;color:var(--card-ink);font-size:12.5px;font-weight:700;}
  .section-head:hover{background:rgba(36,26,48,.04);}
  .section-head .title-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;
    color:var(--card-ink);font-size:12.5px;font-weight:700;cursor:pointer;text-align:left;padding:0;}
  .section-head .chev{color:var(--purple-700);font-size:10px;transition:transform .15s;flex:none;}
  .section.open .section-head .chev{transform:rotate(90deg);}
  .section-content{display:none;padding:2px 16px 16px;}
  .section.open .section-content{display:block;}

  .attach-btn{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--purple-500);
    background:transparent;color:var(--purple-700);font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;font-weight:700;}
  .attach-btn:hover{background:var(--purple-100);}
  .attach-btn.has-menu-open{background:var(--purple-700);color:#fff;border-color:var(--purple-700);}

  .attach-menu{position:fixed;z-index:200;width:250px;background:var(--card-bg);border:1px solid var(--card-line);
    border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px;}
  .attach-menu .menu-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    color:var(--card-ink-dim);padding:6px 8px 4px;}
  .attach-menu-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    background:none;border:none;border-radius:7px;padding:8px 9px;font-size:12px;color:var(--card-ink);
    cursor:pointer;text-align:left;}
  .attach-menu-item:hover:not(.disabled){background:var(--purple-100);}
  .attach-menu-item.disabled{color:var(--card-ink-dim);cursor:not-allowed;opacity:.6;}
  .attach-menu-item .tag{font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:var(--card-ink-dim);flex:none;}

  /* Activity text styles: A question, B activity, C suggestion, D lead-in, E case study, F keyword prompts,
     G chips, H pause (always visible), I final quote, J citations */
  .q{font-size:13px;line-height:1.5;color:var(--purple-700);font-style:italic;font-weight:400;margin:12px 0;padding-left:10px;
    border-left:1px solid var(--purple-500);}
  .instr{font-size:12px;line-height:1.55;color:var(--card-ink-dim);margin:10px 0;}
  .blk-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
  .act-box{margin:10px 0;}
  .act-box .blk-label{color:var(--purple-700);}
  .act-box ul, .sug-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .act-box li{font-size:12px;line-height:1.5;color:var(--card-ink);padding-left:13px;position:relative;}
  .act-box li:before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--purple-700);}
  .sug-box{border:1.5px dashed #cfc6da;border-radius:9px;padding:9px 11px 10px;margin:10px 0;}
  .sug-box .blk-label{color:var(--card-ink-dim);}
  .sug-box li{font-size:12px;line-height:1.5;color:var(--card-ink-dim);padding-left:13px;position:relative;}
  .sug-box li:before{content:"\2013";position:absolute;left:0;color:#b3a7c2;}
  .case-box{margin:10px 0;padding:10px 12px;border-radius:9px;background:#eef4ff;border-left:3px solid #60a5fa;
    font-size:12px;line-height:1.55;color:#33415c;}
  .case-box .blk-label{color:#2563eb;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px;}
  .chips span{font-size:10.5px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid rgba(124,58,237,.35);color:var(--purple-700);}
  .kw-head{font-size:12px;font-weight:700;color:var(--card-ink);margin:16px 0 8px;}
  .cite{font-weight:400;font-size:10.5px;color:var(--card-ink-dim);}
  ol.kw{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;}
  ol.kw li{font-size:12px;line-height:1.5;color:var(--card-ink);padding-left:2px;}
  ol.kw li::marker{color:var(--card-ink);font-weight:700;}
  ol.kw b{font-weight:700;color:var(--card-ink);}
  .pause-band{padding:13px 16px 14px;background:var(--card-bg);color:var(--purple-700);border-top:1px solid var(--card-line);border-radius:0 0 13px 13px;
    font-size:12.5px;line-height:1.5;}
  .pause-band .blk-label{color:var(--purple-700);}
  .final-note{padding:16px 18px 18px;border-top:1px solid var(--card-line);text-align:center;}
  .final-note p{margin:0;font-style:italic;color:var(--purple-700);font-size:13px;line-height:1.5;}
  .final-note .cite{display:block;margin-top:6px;}

  /* spawned nodes */
  .node.spawned .node-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 14px;}
  .node.spawned .node-head .title{font-size:12.5px;font-weight:700;color:var(--card-ink);}
  .node.spawned .node-head .sub{display:block;font-size:10.5px;font-weight:400;color:var(--card-ink-dim);margin-top:2px;}
  .remove-node-btn{flex:none;width:22px;height:22px;border-radius:50%;border:none;background:transparent;
    color:var(--card-ink-dim);font-size:14px;cursor:pointer;}
  .remove-node-btn:hover{background:rgba(36,26,48,.08);color:var(--card-ink);}

  .node.blank-node{width:300px;}
  .blank-body{padding:12px 14px 14px;}
  textarea.free-note{width:100%;min-height:90px;resize:vertical;font-size:12px;line-height:1.45;
    font-family:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--card-line);
    background:var(--card-bg-2);color:var(--card-ink);}
  textarea.free-note::placeholder{color:rgba(114,100,128,.7);font-style:italic;}
  textarea.free-note:focus{outline:none;border-color:var(--purple-500);background:var(--card-bg);}
  .attach-row{margin-top:8px;}
  .blank-previews{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px;}
  .blank-previews:empty{display:none;}
  .blank-previews{align-items:stretch;}
  .blank-previews img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--card-line);background:var(--card-bg-2);}
  .attach-file-btn{width:100%;font-size:11.5px;padding:7px;border-radius:7px;border:1.5px dashed rgba(168,85,247,.4);
    background:transparent;color:var(--purple-700);cursor:pointer;font-weight:600;}
  .attach-file-btn:hover{background:var(--purple-100);}
  ul.attached-files{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;}
  ul.attached-files li{font-size:11px;color:var(--card-ink-dim);display:flex;justify-content:space-between;
    align-items:center;background:var(--card-bg);border:1px solid var(--card-line);border-radius:6px;padding:4px 4px 4px 8px;gap:6px;}
  ul.attached-files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  ul.attached-files li button{flex:none;width:16px;height:16px;border-radius:50%;border:none;background:transparent;
    color:var(--card-ink-dim);cursor:pointer;font-size:11px;line-height:1;}
  ul.attached-files li button:hover{color:var(--card-ink);}

  .node.tool-node{width:1300px;}
  .head-btns{display:flex;align-items:center;gap:6px;flex:none;}
  .node.wheel-node{width:720px;}
  .node.lib-node{width:1300px;}
  .node.risk-node{width:1100px;}
  .risk-node .dm-frame{height:var(--risk-h,760px);}
  .wheel-mount{position:relative;padding:12px 16px 16px;}
  .wheel-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:26px;}
  .wheel-bar .w-count{font-size:11.5px;color:var(--card-ink-dim);}
  .wheel-bar button{font:inherit;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px;
    border:1px solid rgba(168,85,247,.45);background:#fff;color:var(--purple-700);cursor:pointer;}
  .wheel-bar button:disabled{opacity:.4;cursor:default;}
  .wheel-svg{display:block;width:100%;height:auto;}
  .node.sized > .wheel-mount, .node.fullscreen > .wheel-mount{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .node.sized .wheel-svg, .node.fullscreen .wheel-svg{flex:1 1 auto;min-height:0;height:100%;}
  .wcell{cursor:pointer;outline:none;}
  .wcell path{transition:fill .12s;}
  .wcell text{pointer-events:none;user-select:none;transition:fill .12s;}
  .wcell:hover path{filter:brightness(.94);}
  .wcell:focus-visible path{stroke:var(--purple-700);stroke-width:2.5;}
  .wcell.on path{fill:#6b1f80 !important;}
  .wcell.on text{fill:#fff !important;}
  .fs-btn{font:inherit;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px;
    border:1px solid rgba(168,85,247,.45);background:#fff;color:var(--purple-700);cursor:pointer;white-space:nowrap;}
  .fs-btn:hover{background:var(--purple-100);}
  .node.fullscreen .fs-btn{background:var(--purple-700);border-color:var(--purple-700);color:#fff;}
  .node.fullscreen{position:fixed !important;left:16px !important;top:16px !important;right:16px !important;bottom:16px !important;
    width:auto !important;height:auto !important;z-index:900;display:flex;flex-direction:column;}
  .node.fullscreen > *{flex:none;}
  .node.fullscreen > .dm-mount{flex:1 1 auto;min-height:0;}
  .node.fullscreen .dm-frame{height:100%;}
  .node.fullscreen > .rz, .node.fullscreen .remove-node-btn{display:none;}
  .node.fullscreen .node-head{cursor:default;}
  body.has-fullscreen:after{content:'';position:fixed;inset:0;background:rgba(18,18,20,.82);z-index:899;}
  body.has-fullscreen #zoom-controls, body.has-fullscreen #outer-edges{display:none;}
  .dm-mount{position:relative;padding:0;}
  .dm-frame{display:block;width:100%;height:900px;border:0;border-radius:0 0 13px 13px;background:#fff;}
  /* while a node or Library card is being dragged, let the pointer pass over embedded matrices */
  body.node-dragging .dm-frame{pointer-events:none;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
    background:var(--purple-900);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:500;max-width:70vw;text-align:center;
    border:1px solid rgba(168,85,247,.4);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<div id="canvas-wrap">
  <div id="board">
    <svg id="outer-edges" width="3000" height="1800"></svg>
  </div>
</div>

<div id="zoom-controls">
  <button id="zoom-out-btn" title="Zoom out">−</button>
  <button id="zoom-pct-btn" class="zoom-pct" title="Reset to the default view (83%)">83%</button>
  <button id="zoom-in-btn" title="Zoom in">+</button>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // ================= shared helpers =================
  var uidCounter = 1;
  function uid(p){ return p + (uidCounter++); }
  function clone(v){ return JSON.parse(JSON.stringify(v)); }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  // curved connector between two nodes (outer canvas): it leaves the activity in a wide bend and
  // arrives at the tool / note in a short one
  function curveCtl(x1,y1,x2,y2){
    var ax = Math.abs(x2 - x1), ay = Math.abs(y2 - y1);
    var k1 = Math.max(90, ax * 0.6, ay * 0.55), k2 = Math.max(30, ax * 0.25);

er.on{background-color:var(--ind-other-on);}\n  .cell.case.ind-nonspecified{border-color:var(--ind-nonspecified-ink);color:var(--ind-nonspecified-ink);background-color:var(--ind-nonspecified-dim);}\n  .cell.case.ind-nonspecified.on{background-color:var(--ind-nonspecified-on);}\n  .cell.case.ind-slrother{border-color:var(--ind-slrother-ink);color:var(--ind-slrother-ink);background-color:var(--ind-slrother-dim);}\n  .cell.case.ind-slrother.on{background-color:var(--ind-slrother-on);}\n\n  /* Highlighted cells: the fill gets stronger, so the label takes a much darker shade of the\n     cell's own colour to stay readable (same hue, no bold). Doubled .on lifts the specificity\n     above every per-column / per-industry colour rule. */\n  .dm-board .cell.on.on.col-population{color:#2e0f5c;}\n  .dm-board .cell.on.on.col-barriers{color:#3f0f68;}\n  .dm-board .cell.on.on.col-access{color:#3f0f68;}\n  .dm-board .cell.on.on.col-capabilities{color:#0e2569;}\n  .dm-board .cell.on.on.col-barriers.unmapped,\n  .dm-board .cell.on.on.col-capabilities.unmapped{color:#1e2733;}\n  .dm-board .cell.on.on.case{color:#121a24;}\n  .dm-board .cell.on.on.case.ind-government{color:#3f0f68;}\n  .dm-board .cell.on.on.case.ind-finance{color:#303b12;}\n  .dm-board .cell.on.on.case.ind-healthcare{color:#3D2300;}\n  .dm-board .cell.on.on.case.ind-other{color:#1e2733;}\n  .dm-board .cell.on.on.case.ind-nonspecified{color:#2c2a26;}\n  .dm-board .cell.on.on.case.ind-slrother{color:#3b2e1e;}\n\n  /* SLR development level: 4 equal steps along the bottom edge of a paper node (filled = reached, outlined = not yet) */\n  .dev-bar{position:absolute;left:9px;right:9px;bottom:3px;height:6px;display:flex;gap:2px;}\n  .dev-bar i{flex:1 1 0;min-width:0;box-sizing:border-box;border-radius:1px;background:#fff;border:1px solid #c3c7cd;}\n  .dev-bar i.f{background:var(--dev-col,#241a30);border-color:var(--dev-col,#241a30);box-shadow:0 0 0 1px rgba(255,255,255,.9);}\n  .link-count{position:absolute;top:-9px;right:-9px;box-sizing:border-box;min-width:20px;height:20px;padding:0 5px;border-radius:999px;\n    background:#fff;border:1px solid var(--purple-700);color:var(--purple-700);font-size:11px;font-weight:600;line-height:18px;text-align:center;\n    pointer-events:none;font-variant-numeric:tabular-nums;}\n  /* Counter takes the colour coding of its own column. */\n  .cell.col-population .link-count{border-color:var(--population-ink);color:var(--population-ink);}\n  .cell.col-population{padding-right:44px;}      /* room for the coverage badge, so a label never runs under it */\n  .cell.col-population .link-count.pop-cov{top:5px;right:6px;}      /* coverage count sits fully inside the node, off the border */\n  .cell.col-barriers .link-count{border-color:var(--barriers-ink);color:var(--barriers-ink);}\n  .cell.col-barriers.unmapped .link-count,\n  .cell.col-capabilities.unmapped .link-count{border-color:var(--barriers-unmapped-ink);color:var(--barriers-unmapped-ink);}\n  .cell.col-access .link-count{border-color:var(--access-ink);color:var(--access-ink);}\n  .cell.col-capabilities .link-count{border-color:var(--capabilities-ink);color:var(--capabilities-ink);}\n  .stage-label .link-count{position:relative;top:auto;right:auto;display:inline-block;margin-left:8px;vertical-align:middle;\n    border-color:var(--barriers-ink);color:var(--barriers-ink);font-variant-caps:normal;letter-spacing:0;line-height:18px;}\n  .access-arrow{display:flex;justify-content:center;color:rgba(126,34,206,.4);font-size:12px;margin:-3px 0;}\n  .cell.pinned{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--population-ink);}\n\n  .page-card{position:relative;}\n  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}\n  .legend-btn{font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:6px 12px;\n    border-radius:7px;border:1px solid rgba(124,58,237,.4);background:transparent;color:var(--purple-700);cursor:pointer;}\n  .legend-btn:hover,.legend-btn[aria-expanded=\"true\"]{background:rgba(124,58,237,.1);}\n  .legend-btn[aria-pressed=\"true\"]{background:var(--purple-700);border-color:var(--purple-700);color:#fff;}\n  .legend-btn:focus-visible{outline:2px solid var(--purple-700);outline-offset:2px;}\n  .legend-panel{position:absolute;bottom:66px;right:20px;z-index:40;width:min(300px,calc(100% - 28px));box-sizing:border-box;\n    background:#fff;border:1px solid var(--card-line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 22px rgba(36,26,48,.18);\n    font-size:12.5px;line-height:1.35;color:var(--ink);}\n  .legend-panel[hidden]{display:none;}\n  .lg-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);margin:0 0 6px;}\n  .lg-title:not(:first-child){margin-top:12px;}\n  .lg-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}\n  .lg-row span{min-width:0;}\n  .lg-line{width:44px;height:10px;flex:none;}\n  .lg-line-sw{width:24px;}\n  .lg-swatches{display:flex;flex-wrap:wrap;gap:6px 14px;}\n  .lg-sw{display:inline-flex;align-items:center;gap:6px;}\n  .lg-sw i{width:14px;height:14px;border-radius:4px;border:1.5px solid;flex:none;display:inline-block;}\n  .group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;\n    color:var(--ink-dim);margin:10px 0 1px;}\n  .group-label:first-child{margin-top:0;}\n  .group-toggle{display:flex;align-items:center;gap:6px;width:100%;margin:8px 0 0;padding:6px 8px;\n    border:1px solid var(--canvas-line);border-radius:7px;background:rgba(36,26,48,.03);\n    font:inherit;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;\n    color:var(--ink);cursor:pointer;text-align:left;}\n  .group-toggle:first-child{margin-top:0;}\n  .group-toggle:hover{background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.4);}\n  .group-toggle:focus-visible{outline:2px solid var(--purple-700);outline-offset:2px;}\n  .group-empty{font-size:12px;color:var(--ink-dim);font-style:italic;padding:4px 8px 0;}\n  .group-toggle .chev{width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;\n    transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 2px 0 1px;}\n  .group-toggle.open .chev{transform:rotate(45deg);}\n  .group-toggle .group-name{flex:1;min-width:0;}\n  .group-toggle .group-count{font-weight:700;color:var(--ink-dim);letter-spacing:0;}\n  .group-toggle .group-badge{font-size:10.5px;font-weight:700;letter-spacing:0;text-transform:none;\n    color:#fff;background:var(--purple-700);border-radius:999px;padding:1px 7px;}\n\n  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);\n    background:var(--purple-900);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;\n    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:500;max-width:70vw;text-align:center;\n    border:1px solid rgba(168,85,247,.4);}\n  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"page-card\">\n  \u003cdiv class=\"page-head\">\u003ch1>Digital Inclusion Matrix\u003c/h1>\n    \u003cdiv class=\"head-actions\">\n      \u003cbutton type=\"button\" class=\"legend-btn\" id=\"hideBtn\" aria-pressed=\"false\" title=\"Hide the nodes that have no visible link in the current view\">Hide unconnected\u003c/button>\n      \u003cbutton type=\"button\" class=\"legend-btn\" id=\"legendBtn\" aria-expanded=\"false\" aria-controls=\"legendPanel\">Legend\u003c/button>\n      \u003cspan class=\"export-wrap\">\n        \u003cbutton type=\"button\" class=\"legend-btn\" id=\"exportBtn\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"exportMenu\" title=\"Save the matrix as shown now\">Export\u003c/button>\n        \u003cdiv class=\"export-menu\" id=\"exportMenu\" role=\"menu\" hidden>\n          \u003cbutton type=\"button\" role=\"menuitem\" data-export=\"svg\">SVG (current view)\u003c/button>\n          \u003cbutton type=\"button\" role=\"menuitem\" data-export=\"png\">PNG 3&times;\u003c/button>\n          \u003cbutton type=\"button\" role=\"menuitem\" data-export=\"pdf\">PDF\u003c/button>\n        \u003c/div>\n      \u003c/span>\n      \u003cbutton type=\"button\" class=\"legend-btn\" id=\"presBtn\" aria-pressed=\"false\" title=\"Show only the matrix, the legend and the view buttons\">Presentation mode\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"view-bar\" id=\"viewBar\" role=\"group\" aria-label=\"Presentation views\">\u003c/div>\n  \u003cdiv class=\"legend-panel\" id=\"legendPanel\" hidden>\n    \u003cdiv class=\"lg-title\">Line style\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"41\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"2.5\"/>\u003c/svg>\u003cspan>Reported (D1 case study): solid\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"41\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"1.75\" stroke-dasharray=\"5 4\"/>\u003c/svg>\u003cspan>Interpreted (D2 case study): dashed\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"41\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"2.5\"/>\u003c/svg>\u003cspan>Proposed in research (SLR): solid\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"41\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"1.5\" stroke-dasharray=\"2 4\"/>\u003c/svg>\u003cspan>Future work (not implemented): short dash\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"41\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"1.5\" stroke-dasharray=\"1 4\" stroke-linecap=\"round\"/>\u003c/svg>\u003cspan>Direct link to a non-mappable barrier (addressed by service design, not through a stage of access): dotted\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003cline x1=\"3\" y1=\"5\" x2=\"36\" y2=\"5\" stroke=\"#241a30\" stroke-width=\"3\"/>\u003ccircle cx=\"37\" cy=\"5\" r=\"3\" fill=\"#241a30\"/>\u003c/svg>\u003cspan>Dot on a stage border: the flow stops at the stage (no barrier); the number by the stage name counts those case studies / papers\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-title\">Line colour\u003c/div>\n    \u003cdiv class=\"lg-swatches\">\n      \u003cspan class=\"lg-sw\">\u003csvg class=\"lg-line lg-line-sw\" viewBox=\"0 0 24 10\" aria-hidden=\"true\">\u003cline data-line-ind=\"finance\" x1=\"1\" y1=\"5\" x2=\"23\" y2=\"5\" stroke-width=\"4\"/>\u003c/svg>Finance\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003csvg class=\"lg-line lg-line-sw\" viewBox=\"0 0 24 10\" aria-hidden=\"true\">\u003cline data-line-ind=\"government\" x1=\"1\" y1=\"5\" x2=\"23\" y2=\"5\" stroke-width=\"4\"/>\u003c/svg>Public\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003csvg class=\"lg-line lg-line-sw\" viewBox=\"0 0 24 10\" aria-hidden=\"true\">\u003cline data-line-ind=\"healthcare\" x1=\"1\" y1=\"5\" x2=\"23\" y2=\"5\" stroke-width=\"4\"/>\u003c/svg>Healthcare\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003csvg class=\"lg-line lg-line-sw\" viewBox=\"0 0 24 10\" aria-hidden=\"true\">\u003cline data-line-ind=\"nonspecified\" x1=\"1\" y1=\"5\" x2=\"23\" y2=\"5\" stroke-width=\"4\"/>\u003c/svg>SLR: non specified\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003csvg class=\"lg-line lg-line-sw\" viewBox=\"0 0 24 10\" aria-hidden=\"true\">\u003cline data-line-ind=\"slrother\" x1=\"1\" y1=\"5\" x2=\"23\" y2=\"5\" stroke-width=\"4\"/>\u003c/svg>SLR: other\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"lg-title\">Bar on SLR papers\u003c/div>\n    \u003cdiv class=\"lg-row\">\u003csvg class=\"lg-line\" viewBox=\"0 0 44 10\" aria-hidden=\"true\">\u003crect x=\"1\" y=\"2.5\" width=\"9\" height=\"5\" rx=\"1\" fill=\"#241a30\"/>\u003crect x=\"12\" y=\"2.5\" width=\"9\" height=\"5\" rx=\"1\" fill=\"#241a30\"/>\u003crect x=\"23\" y=\"2.5\" width=\"9\" height=\"5\" rx=\"1\" fill=\"#fff\" stroke=\"#c3c7cd\"/>\u003crect x=\"34\" y=\"2.5\" width=\"9\" height=\"5\" rx=\"1\" fill=\"#fff\" stroke=\"#c3c7cd\"/>\u003c/svg>\u003cspan>SLR development level: proposed \u2192 designed \u2192 system-tested \u2192 user-tested\u003c/span>\u003c/div>\n    \u003cdiv class=\"lg-title\">Sector\u003c/div>\n    \u003cdiv class=\"lg-swatches\">\n      \u003cspan class=\"lg-sw\">\u003ci style=\"background:var(--ind-government-dim);border-color:var(--ind-government-ink)\">\u003c/i>Public\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003ci style=\"background:var(--ind-healthcare-on);border-color:var(--ind-healthcare-ink)\">\u003c/i>Healthcare\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003ci style=\"background:var(--ind-finance-dim);border-color:var(--ind-finance-ink)\">\u003c/i>Finance\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003ci style=\"background:var(--ind-nonspecified-dim);border-color:var(--ind-nonspecified-ink)\">\u003c/i>Non specified\u003c/span>\n      \u003cspan class=\"lg-sw\">\u003ci style=\"background:var(--ind-slrother-dim);border-color:var(--ind-slrother-ink)\">\u003c/i>Other\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"dm-canvas-wrap\">\u003cdiv class=\"dm-board\">\u003cdiv class=\"sticky-strip\">\u003c/div>\u003csvg class=\"dm-edges\" width=\"1000\" height=\"760\">\n    \u003cdefs>\u003cclipPath id=\"cellMask\" clipPathUnits=\"userSpaceOnUse\">\u003cpath id=\"cellMaskPath\" clip-rule=\"evenodd\" d=\"\"/>\u003c/clipPath>\u003c/defs>\n  \u003c/svg>\u003c/div>\n    \u003cdiv class=\"zoom-ctl\" id=\"zoomCtl\">\n      \u003cbutton type=\"button\" id=\"zoomIn\" title=\"Zoom in\" aria-label=\"Zoom in\">+\u003c/button>\n      \u003cbutton type=\"button\" id=\"zoomOut\" title=\"Zoom out\" aria-label=\"Zoom out\">\u2212\u003c/button>\n      \u003cbutton type=\"button\" class=\"fit\" id=\"zoomFit\" title=\"Fit to screen (Esc)\">Fit to screen\u003c/button>\n      \u003cspan class=\"pct\" id=\"zoomPct\" aria-live=\"polite\">100%\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"toast\">\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  // ================= shared helpers =================\n  function esc(s){\n    return String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  }\n  function toast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    clearTimeout(toast._h);\n    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2000);\n  }\n  // One right-angle \"elbow\" leg from (x1,y1) to (x2,y2), as a path-command string that\n  // continues from wherever the path cursor already is (no leading M) \u2014 so several legs\n  // can be chained into one continuous multi-waypoint path. `offset` nudges this leg's\n  // vertical midpoint segment left/right, keeping the exact same orthogonal shape used by\n  // every other connection in the matrix \u2014 only its horizontal position shifts, so\n  // multiple case-study traces can run as parallel elbows instead of a different line style.\n  function elbowLeg(x1,y1,x2,y2,offset){\n    offset = offset || 0;\n    if (Math.abs(y2-y1) \u003c 1){ return ' L '+x2+' '+y2; }\n    var midX = (x1+x2)/2 + offset;\n    var r = Math.max(2, Math.min(10, Math.abs(y2-y1)/2, Math.abs(midX-x1)-2, Math.abs(x2-midX)-2));\n    var dir = y2 > y1 ? 1 : -1;\n    return ' L '+(midX-r)+' '+y1+\n      ' Q '+midX+' '+y1+' '+midX+' '+(y1+r*dir)+\n      ' L '+midX+' '+(y2-r*dir)+\n      ' Q '+midX+' '+y2+' '+(midX+r)+' '+y2+\n      ' L '+x2+' '+y2;\n  }\n  // Plain two-point connector (the common case): a single elbow leg from (x1,y1) to (x2,y2).\n  function elbow(x1,y1,x2,y2,offset){\n    return 'M '+x1+' '+y1+ elbowLeg(x1,y1,x2,y2,offset);\n  }\n  // Multi-waypoint connector: threads elbow legs through every point in `points` (each\n  // {x,y}) as ONE continuous path, so a line can be routed via an intermediate waypoint\n  // (e.g. dipping past a specific Access-stage row) instead of cutting straight through.\n  function elbowVia(points, offset){\n    var d = 'M '+points[0].x+' '+points[0].y;\n    for (var i=1;i\u003cpoints.length;i++){\n      d += elbowLeg(points[i-1].x, points[i-1].y, points[i].x, points[i].y, offset);\n    }\n    return d;\n  }\n\n  // ================= fixed schema =================\n  var COLS = ['population','barriers','access','capabilities','caseStudies'];\n  var COL_META = {\n    population:   { label:'Population' },\n    barriers:     { label:'Barriers' },\n    access:       { label:'Stages of Access' },\n    capabilities: { label:'Capabilities' },\n    caseStudies:  { label:'Case Studies' }\n  };\n  function colIdx(c){ return COLS.indexOf(c); }\n  function cellKey(col,id){ return col+':'+id; }\n  var connCounter = 1;\n  function conn(aCol,aId,bCol,bId){\n    if (colIdx(aCol) > colIdx(bCol)){ var t1=aCol,t2=aId; aCol=bCol; aId=bId; bCol=t1; bId=t2; }\n    return { id: 'conn-'+(connCounter++), aCol:aCol, aId:aId, bCol:bCol, bId:bId };\n  }\n  // A \"second-hop\" connection that doesn't touch a case study directly (e.g. a specific\n  // Capability continuing on to specific Barriers) but should only ever appear as part of\n  // ONE named case study's trace. Tagging it with `scope` \u2014 rather than letting computeTrace\n  // walk the graph generically \u2014 is what keeps it from leaking into any other case study that\n  // happens to share that same capability cell (several do).\n  function connVia(aCol,aId,bCol,bId,viaCaseStudy){\n    var c = conn(aCol,aId,bCol,bId);\n    c.scope = viaCaseStudy;\n    return c;\n  }\n\n  // ================= the fixed dataset (not editable \u2014 this is a visualization, not a tool) =================\n  var DATA = {\n    visibility:{ population:true, barriers:true, access:true, capabilities:true, caseStudies:true },\n    cells:{\n      population:[\n        {id:'p1', label:'Low-income people'},\n        {id:'p2', label:'Older adults'},\n        {id:'p3', label:'Racial and ethnic minorities'},\n        {id:'p4', label:'Newcomers/immigrants and refugees'},\n        {id:'p5', label:'People with disability'},\n        {id:'p6', label:'Indigenous groups'},\n        {id:'p7', label:'Women'},\n        {id:'p8', label:'Low-educated people'},\n        {id:'p9', label:'Retired/economically inactive people'},\n        {id:'p10', label:'Unemployed people'}\n      ],\n      barriers:[\n        {id:'b1', label:'Cost of internet plan'},\n        {id:'b2', label:'Cost of devices'},\n        {id:'b3', label:'Cost of connection'},\n        {id:'b4', label:'Lack of access to laptop and desktop'},\n        {id:'b5', label:'Lack of internet availability (infrastructure)'},\n        {id:'b6', label:'Lack of internet quality (infrastructure)'},\n        {id:'b7', label:'Limited digital skills (technological)'},\n        {id:'b8', label:'Limited digital skills (informational)'},\n        {id:'b9', label:'Limited digital skills (strategic)'},\n        {id:'b10', label:'Lack of high-quality hardware'},\n        {id:'b11', label:'Lack of motivation'},\n        {id:'b12', label:'Lack of confidence'},\n        {id:'b13', label:'Fear'},\n        {id:'b14', label:'Safety concerns'},\n        {id:'b15', label:'Safe use of the internet'},\n        {id:'b16', label:'Lack of group-sensitive content and services', unmapped:true},\n        {id:'b17', label:'Language barriers (informational digital skills)'},\n        {id:'b18', label:'Lack of accessible content', unmapped:true},\n        {id:'b19', label:'Lack of bel:\"Public\", dev:\"Evaluation of existing tools\"},\n    {id:\"slr18\", label:\"M. Yu et al. (2026)\", sector:\"healthcare\", sectorLabel:\"Healthcare\", dev:\"Design + user testing\"},\n    {id:\"slr19\", label:\"L. Yu et al. (2026)\", sector:\"slrother\", sectorLabel:\"Other\", dev:\"Theoretical\"},\n    {id:\"slr21\", label:\"Scheffler et al. (2026)\", sector:\"government\", sectorLabel:\"Public\", dev:\"Design, no testing\"},\n    {id:\"slr22\", label:\"Radoji\u010di\u0107 & Vukmirovi\u0107 (2025)\", sector:\"government\", sectorLabel:\"Public\", dev:\"Theoretical\"},\n    {id:\"slr25\", label:\"Reddy & Bell (2025)\", sector:\"government\", sectorLabel:\"Public\", dev:\"Design + user testing\"},\n    {id:\"slr26\", label:\"Qureshi et al. (2025)\", sector:\"healthcare\", sectorLabel:\"Healthcare\", dev:\"Design, no testing\"},\n    {id:\"slr28\", label:\"Baldissera et al. (2024)\", sector:\"healthcare\", sectorLabel:\"Healthcare\", dev:\"Theoretical\"},\n    {id:\"slr29\", label:\"Qureshi et al. (2024)\", sector:\"healthcare\", sectorLabel:\"Healthcare\", dev:\"Design, no testing\"},\n    {id:\"slr32\", label:\"Karthikeyan et al. (2026)\", sector:\"healthcare\", sectorLabel:\"Healthcare\", dev:\"Review\"},\n    {id:\"slr37\", label:\"Capraro et al. (2024)\", sector:\"slrother\", sectorLabel:\"Other\", dev:\"Review\"},\n    {id:\"slr40\", label:\"Abdulkareem (2024)\", sector:\"government\", sectorLabel:\"Public\", dev:\"Theoretical\"}\n  ];\n  // development level of an SLR paper -> [step, name]; step 1 proposed ... step 4 user-tested\n  var DEV_LEVELS = {\n    'Review': [1, 'proposed'], 'Theoretical': [1, 'proposed'],\n    'Design, no testing': [2, 'designed'],\n    'Design + system testing': [3, 'system-tested'],\n    'Design + user testing': [4, 'user-tested'], 'Evaluation of existing tools': [4, 'user-tested']\n  };\n  var SLR_ROWS = [\n    [\"slr1\", \"c2\", \"proposed\", \"direct\", \"b18\", \"p5\"],\n    [\"slr2\", \"c2\", \"proposed\", \"direct\", \"b18\", \"p5\"],\n    [\"slr3\", \"c3\", \"proposed\", \"direct\", \"b18\", \"p5\"],\n    [\"slr15\", \"c1\", \"proposed\", \"skillsUse\", \"b17\", null],\n    [\"slr15\", \"c5\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr15\", \"c6\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr15\", \"c8\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr15\", \"c12\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr17\", \"c12\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr17\", \"c5\", \"future\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr18\", \"c6\", \"proposed\", \"skillsUse\", \"b7\", \"p8\"],\n    [\"slr18\", \"c6\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr18\", \"c6\", \"proposed\", \"skillsUse\", \"b9\", \"p8\"],\n    [\"slr18\", \"c8\", \"proposed\", \"skillsUse\", \"b7\", \"p8\"],\n    [\"slr18\", \"c8\", \"proposed\", \"skillsUse\", \"b8\", \"p8\"],\n    [\"slr18\", \"c8\", \"proposed\", \"skillsUse\", \"b9\", \"p8\"],\n    [\"slr19\", \"c2\", \"proposed\", \"skillsUse\", \"b7\", \"p2\"],\n    [\"slr19\", \"c3\", \"proposed\", \"skillsUse\", \"b7\", \"p2\"],\n    [\"slr19\", \"c8\", \"proposed\", \"skillsUse\", \"b7\", \"p2\"],\n    [\"slr19\", \"c13\", \"proposed\", \"motivational\", \"b11\", \"p2\"],\n    [\"slr19\", \"c13\", \"proposed\", \"motivational\", \"b12\", \"p2\"],\n    [\"slr19\", \"c13\", \"proposed\", \"motivational\", \"b13\", \"p2\"],\n    [\"slr21\", \"c12\", \"proposed\", \"skillsUse\", \"b7\", null],\n    [\"slr21\", \"c12\", \"proposed\", \"skillsUse\", \"b8\", null],\n    [\"slr21\", \"c12\", \"proposed\", \"skillsUse\", \"b9\", null],\n    [\"slr21\", \"c8\", \"proposed\", \"skillsUse\", \"b7\", null],\n    [\"slr21\", \"c8\", \"proposed\", \"skillsUse\", \"b8\", null],\n    [\"slr21\", \"c8\", \"proposed\", \"skillsUse\", \"b9\", null],\n    [\"slr22\", \"c1\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr22\", \"c6\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr25\", \"c1\", \"proposed\", \"skillsUse\", \"b17\", null],\n    [\"slr25\", \"c6\", \"proposed\", \"skillsUse\", \"b8\", null],\n    [\"slr25\", \"c8\", \"proposed\", \"skillsUse\", \"b8\", null],\n    [\"slr25\", \"c12\", \"proposed\", \"skillsUse\", \"b8\", null],\n    [\"slr26\", \"c12\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr28\", \"c13\", \"future\", \"motivational\", null, null],\n    [\"slr29\", \"c1\", \"future\", \"skillsUse\", null, null],\n    [\"slr29\", \"c5\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr29\", \"c6\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr29\", \"c12\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr32\", \"c1\", \"proposed\", \"skillsUse\", \"b17\", \"p6\"],\n    [\"slr32\", \"c2\", \"proposed\", \"skillsUse\", \"b17\", \"p6\"],\n    [\"slr37\", \"c1\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr37\", \"c2\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr37\", \"c5\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr37\", \"c8\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr37\", \"c12\", \"proposed\", \"skillsUse\", null, null],\n    [\"slr40\", \"c4\", \"proposed\", \"physical\", \"b5\", \"p1\"],\n    [\"slr40\", \"c4\", \"proposed\", \"physical\", \"b2\", \"p1\"],\n    [\"slr40\", \"c4\", \"proposed\", \"physical\", \"b4\", \"p1\"],\n    [\"slr40\", \"c1\", \"proposed\", \"skillsUse\", \"b17\", null],\n    [\"slr40\", \"c5\", \"proposed\", \"skillsUse\", null, null]\n  ];\n  var SLR_CONNS = (function(){\n    var out = [], seen = {};\n    function add(c, link, direct){\n      var k = c.aCol+'|'+c.aId+'|'+c.bCol+'|'+c.bId+'|'+(c.scope||'');\n      if (seen[k]){ if (link === 'proposed') seen[k].slr.link = 'proposed'; return; }\n      c.slr = { link: link, direct: !!direct };\n      seen[k] = c; out.push(c);\n    }\n    SLR_ROWS.forEach(function(r){\n      var pid = r[0], cap = r[1], link = r[2], stage = r[3], bar = r[4], pop = r[5];\n      add(conn('capabilities', cap, 'caseStudies', pid), link);               // paper \u2194 capability\n      if (stage === 'direct'){\n        if (bar) add(connVia('barriers', bar, 'capabilities', cap, pid), link, true);   // capability \u2192 barrier, skipping the stage\n      } else if (bar){\n        add(connVia('barriers', bar, 'capabilities', cap, pid), link);          // capability \u2192 (stage) \u2192 barrier\n      } else {\n        add(connVia('access', stage, 'capabilities', cap, pid), link);          // flow ends at the stage\n      }\n      if (bar && pop) add(connVia('population', pop, 'barriers', bar, pid), link);      // barrier \u2192 population\n    });\n    return out;\n  })();\n  SLR_PAPERS.forEach(function(p){\n    DATA.cells.caseStudies.push({ id:p.id, label:p.label, group:'SLR', industry:p.sector, sectorLabel:p.sectorLabel, dev:p.dev, slr:true });\n  });\n  function allConnections(){ return state.connections.concat(SLR_CONNS); }\n  // D2 case studies are interpreted (not reported) \u2014 their flows are drawn dashed and lighter.\n  function isD2Case(csId){ var c = csId ? getCell('caseStudies', csId) : null; return !!(c && c.group === 'D2'); }\n  var D2_ST = { width:'1.75', hl:'2.5', opacity:'1', cap:'butt', dash:'5 4' };\n  function isSlrPaper(csId){ var c = getCell('caseStudies', csId); return !!(c && c.slr); }\n\n  // Which Access-stage id a given barrier id maps to, from the Barriers\u2192Access\n  // connections already in the data (one access id per barrier; none for the \"unmapped\"\n  // barriers). Used to route a direct case-study\u2192barrier line past that barrier's\n  // corresponding Access row instead of cutting straight across the Access column.\n  function accessForBarrier(barrierId){\n    for (var i=0;i\u003cstate.connections.length;i++){\n      var cn = state.connections[i];\n      if (cn.aCol==='barriers' && cn.aId===barrierId && cn.bCol==='access') return cn.bId;\n    }\n    return null;\n  }\n\n  function industryColorVar(ind){ return 'var(--ind-' + ind + '-ink)'; }\n\n  // Base hue/saturation/lightness per industry, taken from the --ind-*-ink CSS colors.\n  var IND_HSL = {\n    government: { h:272, s:71.7, l:47.1 },\n    finance:    { h:75,  s:48.5, l:32.0 },\n    healthcare: { h:34,  s:99.0, l:51.2 },\n    nonspecified: { h:40, s:5.3,  l:44.3 },\n    slrother:     { h:32, s:27.1, l:44.1 }\n  };\n  // Line colour = one fixed colour per sector (LINE_OVERRIDE below), always at 100% opacity.\n  // D1, D2 and SLR lines share the same colour: they differ only by line style.\n  var LINE_DARKEN = 0.70, LINE_MIN_CONTRAST = 3;\n  function hslToRgb(h, s, l){\n    s /= 100; l /= 100;\n    var k = function(n){ return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);\n    var f = function(n){ return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };\n    return [f(0) * 255, f(8) * 255, f(4) * 255];\n  }\n  function contrastOnWhite(rgb){\n    var lin = rgb.map(function(v){ v /= 255; return v \u003c= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });\n    var L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];\n    return 1.05 / (L + 0.05);\n  }\n  var LINE_OVERRIDE = {        // exact line colour per sector, 100% opacity, identical for D1, D2 and SLR lines\n    government: '#8B45E0',     // Public: vivid violet\n    finance: '#7A9A1E',        // Finance: vivid olive green\n    healthcare: '#E07B00',     // Healthcare: orange (the nodes stay #FE9307)\n    nonspecified: '#7A7A7A',   // Non specified (SLR): grey\n    slrother: '#B08A5A'        // Other (SLR): tan\n  };\n  var LINE_COLOR_CACHE = {};\n  function lineColor(industry){\n    if (LINE_COLOR_CACHE[industry]) return LINE_COLOR_CACHE[industry];\n    if (LINE_OVERRIDE[industry]) return (LINE_COLOR_CACHE[industry] = LINE_OVERRIDE[industry]);\n    var base = IND_HSL[industry]; if (!base) return null;\n    var l = base.l * LINE_DARKEN;\n    while (l > 4 && contrastOnWhite(hslToRgb(base.h, base.s, l)) \u003c LINE_MIN_CONTRAST) l -= 1;\n    return (LINE_COLOR_CACHE[industry] = 'hsl(' + base.h + ', ' + base.s.toFixed(1) + '%, ' + l.toFixed(1) + '%)');\n  }\n  function traceEdgeColor(industry, hop){ return lineColor(industry); }\n  Array.prototype.forEach.call(document.querySelectorAll('[data-line-ind]'), function(el){ el.setAttribute('stroke', lineColor(el.getAttribute('data-line-ind'))); });\n\n  // SLR flows (proposed in research, not deployed): same colour intensity as the other flows, told apart by style only:\n  //   proposed \u2192 solid line;  future work \u2192 short DASHED line;\n  //   direct link to a non-mappable barrier \u2192 DOTTED line (it skips the stage column).\n  function slrColor(industry, link){ return lineColor(industry); }\n  function slrLook(industry, link, direct){\n    var st = { width:'2.5', hl:'3.5', opacity:'1', cap:'butt', dash:'' };\n    if (link === 'future'){ st.dash = '2 4'; st.width = '1.5'; st.hl = '2.5'; }\n    if (direct){ st.dash = '1 4'; st.cap = 'round'; st.width = '1.5'; st.hl = '2.5'; }\n    return { color: slrColor(industry, link), st: st };\n  }\n\n  // Case-study trace: every connection that touches the case study DIRECTLY \u2014 no further\n  // multi-hop spreading. Some case studies (C/B) connect only to Capabilities; others\n  // (D1) connect straight to Barriers and/or Population, skipping Capabilities/Access\n  // entirely. Deliberately not a multi-hop graph walk: a barrier or access stage is shared\n  // by many populations/case studies, so following the chain further than the case study's\n  // own direct links would flood the trace with unrelated cells reached only through that\n  // shared hub. connHops gives each connection a \"how deep into the matrix\" level derived\n  // from the two columns it spans (0 = touches Capabilities, up to 3 = touches Population),\n  // so a direct case-study\u2192population link still renders at the darkest end of the\n  // gradient, matching population's position as the leftmost column.\n  function computeTrace(caseStudyId){\n    var cellKeys = {}; var connIds = {}; var connHops = {};\n    cellKeys[cellKey('caseStudies', caseStudyId)] = true;\n    allConnections().forEach(function(cn){\n      if (!state.visibility[cn.aCol] || !state.visibility[cn.bCol]) return;\n      // A scoped connection (e.g. a Capability continuing on to specific Barriers) is\n      // explicitly tagged for exactly one case study, so it's included on that match alone \u2014\n      // no traversal needed, and no risk of it leaking into another case study that happens\n      // to share the same capability cell.\n      if (cn.scope === caseStudyId){\n        connIds[cn.id] = true;\n        connHops[cn.id] = 3 - Math.min(colIdx(cn.aCol), colIdx(cn.bCol));\n        cellKeys[cellKey(cn.aCol, cn.aId)] = true;\n        cellKeys[cellKey(cn.bCol, cn.bId)] = true;\n        // A routed Barrier\u2194Capability connection passes through (and visually dips below)\n        // a specific Access stage, so that stage is part of the trace too, not just the line\n        // passing near it.\n        if (cn.aCol === 'barriers' && cn.bCol === 'capabilities' && state.visibility.access){\n          var relatedAccessId = accessForBarrier(cn.aId);\n          if (relatedAccessId) cellKeys[cellKey('access', relatedAccessId)] = true;\n        }\n        return;\n      }\n      if (cn.scope) return;\n      var touchesA = cn.aCol==='caseStudies' && cn.aId===caseStudyId;\n      var touchesB = cn.bCol==='caseStudies' && cn.bId===caseStudyId;\n      if (!touchesA && !touchesB) return;\n      var otherCol = touchesA ? cn.bCol : cn.aCol;\n      var otherId = touchesA ? cn.bId : cn.aId;\n      connIds[cn.id] = true;\n      connHops[cn.id] = 3 - Math.min(colIdx(cn.aCol), colIdx(cn.bCol));\n      cellKeys[cellKey(otherCol, otherId)] = true;\n      // A direct Barrier\u2194Case-study connection (no capability assigned) is also routed via\n      // that barrier's Access-stage row, so highlight that stage too, same as the routed\n      // Barrier\u2194Capability case above.\n      if (otherCol === 'barriers' && state.visibility.access){\n        var directAccessId = accessForBarrier(otherId);\n        if (directAccessId) cellKeys[cellKey('access', directAccessId)] = true;\n      }\n    });\n    return { cellKeys: cellKeys, connIds: connIds, connHops: connHops };\n  }\n\n  function neighborsVia(result, col, id, neighborCol){\n    var res = [];\n    state.connections.forEach(function(cn){\n      if (cn.aCol===col && cn.aId===id && cn.bCol===neighborCol){ result.connIds[cn.id]=true; res.push(cn.bId); }\n      if (cn.bCol===col && cn.bId===id && cn.aCol===neighborCol){ result.connIds[cn.id]=true; res.push(cn.aId); }\n    });\n    return res;\n  }\n  function computeSelectionHighlight(sels){\n    var union = { cellKeys:{}, connIds:{}, capConnIds:{} };\n    sels.forEach(function(sel){\n      var one = computeSingleCellHighlight(sel);\n      Object.keys(one.cellKeys).forEach(function(k){ union.cellKeys[k] = true; });\n      Object.keys(one.connIds).forEach(function(k){ union.connIds[k] = true; });\n      Object.keys(one.capConnIds || {}).forEach(function(k){ union.capConnIds[k] = true; });\n    });\n    return union;\n  }\n  function computeSingleCellHighlight(sel){\n    var result = { cellKeys:{}, connIds:{}, capConnIds:{} };\n    result.cellKeys[cellKey(sel.col, sel.id)] = true;\n    if (sel.col === 'population'){\n      if (state.visibility.barriers){\n        var barrierIds = neighborsVia(result, 'population', sel.id, 'barriers');\n        barrierIds.forEach(function(bid){\n          result.cellKeys[cellKey('barriers',bid)] = true;\n          if (state.visibility.access){\n            neighborsVia(result, 'barriers', bid, 'access').forEach(function(aid){\n              result.cellKeys[cellKey('access',aid)] = true;\n            });\n          }\n        });\n      }\n    } else if (sel.col === 'access'){\n      if (state.visibility.barriers){\n        var bIds = neighborsVia(result, 'access', sel.id, 'barriers');\n        bIds.forEach(function(bid){\n          result.cellKeys[cellKey('barriers',bid)] = true;\n          if (state.visibility.population){\n            neighborsVia(result, 'barriers', bid, 'population').forEach(function(pid){\n              result.cellKeys[cellKey('population',pid)] = true;\n            });\n          }\n        });\n      }\n      if (state.visibility.capabilities){\n        neighborsVia(result, 'access', sel.id, 'capabilities').forEach(function(cid){\n          result.cellKeys[cellKey('capabilities',cid)] = true;\n        });\n        // Every capability link that reaches this stage: ending on one of its barriers, or on the\n        // stage header itself (flows that stop at the stage). Case-study and SLR links alike.\n        var stageBarriers = {};\n        (STAGE_BARRIER_ORDER[sel.id] || []).forEach(function(bid){ stageBarriers[bid] = true; });\n        allConnections().forEach(function(cn){\n          if (!cn.scope || cn.bCol !== 'capabilities' || !state.visibility[cn.bCol]) return;\n          var reachesStage = (cn.aCol === 'access' && cn.aId === sel.id) ||\n                             (cn.aCol === 'barriers' && stageBarriers[cn.aId] && state.visibility.barriers);\n          if (!reachesStage) return;\n          result.capConnIds[cn.id] = true;\n          result.connIds[cn.id] = true;\n          result.cellKeys[cellKey('capabilities', cn.bId)] = true;\n          if (cn.aCol === 'barriers') result.cellKeys[cellKey('barriers', cn.aId)] = true;\n        });\n      }\n    } else {\n      state.connections.forEach(function(cn){\n        var touchesA = cn.aCol===sel.col && cn.aId===sel.id;\n        var touchesB = cn.bCol===sel.col && cn.bId===sel.id;\n        if (!touchesA && !touchesB) return;\n        if (!state.visibility[cn.aCol] || !state.visibility[cn.bCol]) return;\n        result.connIds[cn.id] = true;\n        result.cellKeys[cellKey(cn.aCol,cn.aId)] = true;\n        result.cellKeys[cellKey(cn.bCol,cn.bId)] = true;\n      });\n    }\n    return result;\n  }\n\n  // ================= layout and camera =================\n  // The board is laid out at its natural size (13 px text), with the five columns spread over the full width\n  // (48 px margins). The \"camera\" (scale + translation, applied as one CSS transform) then frames it: Fit to screen,\n  // zoom, pan. Layout work (rendering, measuring) always happens with the transform removed, so every measured\n  // coordinate is a true board coordinate.\n  var MARGIN_X = 48, MIN_GAP = 44, FIT_FLOOR = 0.92, MIN_S = 0.3, MAX_S = 3, STICK_TOP = 6;\n  var cam = { s: 1, tx: MARGIN_X, ty: 10, fit: true };\n  var layoutS0 = 1, boardW = 0, boardH = 0, camTimer = null, lastLinked = null;\n  var zoomPct = document.getElementById('zoomPct');\n\n  function clampCam(){\n    var cw = canvasWrap.clientWidth, ch = canvasWrap.clientHeight, W = boardW * cam.s, H = boardH * cam.s;\n    cam.s = Math.max(MIN_S, Math.min(MAX_S, cam.s));\n    W = boardW * cam.s; H = boardH * cam.s;\n    var maxTx = MARGIN_X, minTx = Math.min(MARGIN_X, cw - W - MARGIN_X);\n    if (W + 2 * MARGIN_X \u003c= cw){ minTx = MARGIN_X; maxTx = cw - W - MARGIN_X; }\n    cam.tx = Math.max(minTx, Math.min(maxTx, cam.tx));\n    var maxTy = 24, minTy = Math.min(maxTy, ch - H - 24);\n    cam.ty = Math.max(minTy, Math.min(maxTy, cam.ty));\n  }\n  function updateSticky(){\n    var shift = Math.max(0, (STICK_TOP - cam.ty) / cam.s);\n    board.style.setProperty('--stick', shift.toFixed(2) + 'px');\n    board.classList.toggle('stuck', shift > 0.5);\n  }\n  function applyCam(anim){\n    clearTimeout(camTimer);\n    if (anim){ board.classList.add('anim'); camTimer = setTimeout(function(){ board.classList.remove('anim'); }, 420); }\n    else board.classList.remove('anim');\n    board.style.transform = 'translate(' + cam.tx.toFixed(2) + 'px,' + cam.ty.toFixed(2) + 'px) scale(' + cam.s.toFixed(4) + ')';\n    if (zoomPct) zoomPct.textContent = Math.round(cam.s * 100) + '%';\n    updateSticky();\n  }\n  // Fit to screen: the whole width of the board (5 columns, 48 px margins) at the largest readable scale; the\n  // scale never drops below FIT_FLOOR because of the height (a tall board is panned vertically; headers stay put),\n  // and only drops below it when the lanes need more width than the screen has.\n  function fitCam(){\n    var cw = canvasWrap.clientWidth;\n    var s = Math.min((cw - 2 * MARGIN_X) / boardW, layoutS0);\n    if (!isFinite(s) || s \u003c= 0) s = 1;\n    cam.s = s; cam.tx = MARGIN_X + Math.max(0, (cw - 2 * MARGIN_X - boardW * s) / 2); cam.ty = 10; cam.fit = true;\n  }\n  function zoomAt(px, py, factor, anim){\n    var ns = Math.max(MIN_S, Math.min(MAX_S, cam.s * factor));\n    var k = ns / cam.s;\n    cam.tx = px - (px - cam.tx) * k; cam.ty = py - (py - cam.ty) * k; cam.s = ns; cam.fit = false;\n    clampCam(); applyCam(anim);\n  }\n\n  // Spreads the columns over the available width: the board is sized for the layout scale layoutS0 (the largest\n  // scale \u003c= 1 at which the whole height fits, but never below FIT_FLOOR), and what is left after the column\n  // widths is shared out evenly as the gaps between columns.\n  function layoutColumns(){\n    board.classList.remove('anim');\n    board.style.transform = 'none';\n    var cols = Array.prototype.slice.call(board.querySelectorAll(':scope > .column'));\n    cols.forEach(function(c){ c.style.marginRight = ''; });\n    board.style.setProperty('--stick', '0px');\n    board.classList.remove('stuck');\n    var cw = canvasWrap.clientWidth, ch = canvasWrap.clientHeight;\n    var availW = cw - 2 * MARGIN_X, availH = ch - 24;\n    var sumW = 0; cols.forEach(function(c){ sumW += c.offsetWidth; });\n    var heads = board.querySelectorAll('.col-head'), hh = 0;\n    Array.prototype.forEach.call(heads, function(h){ hh = Math.max(hh, h.offsetHeight); });\n    board.style.setProperty('--strip-h', (hh + 14) + 'px');\n    var natH = board.offsetHeight || 1;\n    var s0 = Math.min(1, Math.max(FIT_FLOOR, availH / natH));\n    s0 = Math.min(s0, availW / (sumW + (cols.length - 1) * MIN_GAP));\n    var gap = Math.max(MIN_GAP, (availW / s0 - sumW) / Math.max(1, cols.length - 1));\n    board.style.gap = gap + 'px';\n    GAP_BASE = gap; BOARD_GAP = gap; layoutS0 = s0;\n  }\n\n  // \"Hide unconnected\": nodes that have no visible link in the current view are taken out of the flow, so the\n  // columns close up. Nothing is hidden while no link is drawn at all (nothing selected).\n  function applyHide(linked){\n    Array.prototype.forEach.call(board.querySelectorAll('.cell'), function(c){\n      if (!linked[c.dataset.col + ':' + c.dataset.id]) c.classList.add('unlinked');\n    });\n    var boxes = Array.prototype.slice.call(board.querySelectorAll('.stage-box'));\n    boxes.forEach(function(b){\n      var own = b.dataset.id && linked['access:' + b.dataset.id];\n      if (!own && !b.querySelector('.cell:not(.unlinked)')) b.classList.add('unlinked');\n    });\n    var list = board.querySelector('.column[data-col=\"access\"] .col-list');\n    if (list){\n      var kids = Array.prototype.slice.call(list.children);\n      kids.forEach(function(k, i){\n        if (k.classList.contains('stage-arrow')){\n          var p = kids[i - 1], n = kids[i + 1];\n          if ((p && p.classList.contains('unlinked')) || (n && n.classList.contains('unlinked'))) k.classList.add('unlinked');\n        }\n        if (k.classList.contains('stage-gap')){\n          var o = list.querySelector('.stage-box.outside');\n          var anyStage = list.querySelector('.stage-box:not(.outside):not(.unlinked)');\n          if ((o && o.classList.contains('unlinked')) || !anyStage) k.classList.add('unlinked');\n        }\n      });\n    }\n  }\n\n  function renderAll(){\n    // Remove the camera transform before measuring/rendering, since the cell position math below\n    // (getBoundingClientRect-based) needs true, untransformed pixels.\n    board.classList.remove('anim');\n    board.style.transform = 'none';\n    Array.prototype.slice.call(board.querySelectorAll('.column')).forEach(function(n){ n.remove(); });\n\n    var traceInfo = state.activeTraces.map(function(csId){\n      var cs = getCell('caseStudies', csId);\n      return { csId: csId, industry: cs ? cs.industry : null, data: computeTrace(csId) };\n    }).filter(function(t){ return !!t.industry; });\n\n    // Each active case study gets its own fan-out offset (bow) so that when two or more\n    // are selected at once, their ribbons curve apart instead of stacking exactly on top\n    // of each other where they'd otherwise be indistinguishable. The spread is capped to\n    // comfortably fit inside the column gap no matter how many case studies are active at\n    // once (selecting all of them should still leave room, not push lines into the cells).\n    var n = traceInfo.length;\n    var maxSpread = BOARD_GAP - 24;\n    var bowStep = n > 1 ? Math.min(16, maxSpread / (n-1)) : 0;\n    var cellTraceColor = {}; var connTraceColor = {}; var connTraceHop = {}; var connTraceBow = {};\n    traceInfo.forEach(function(t, i){\n      var bow = n > 1 ? (i - (n-1)/2) * bowStep : 0;\n      Object.keys(t.data.cellKeys).forEach(function(k){ cellTraceColor[k] = t.industry; });\n      Object.keys(t.data.connIds).forEach(function(k){\n        connTraceColor[k] = t.industry;\n        connTraceHop[k] = t.data.connHops[k];\n        connTraceBow[k] = bow;\n      });\n    });\n    var traceModeOn = traceInfo.length > 0;\n\n    var singleHop = (!traceModeOn && state.selectedCells.length > 0) ? computeSelectionHighlight(state.selectedCells) : null;\n    var anyHighlight = traceModeOn || !!singleHop;\n\n    COLS.forEach(function(col){\n      if (col === 'barriers') return; // the barriers live inside the Stages of Access column\n      renderColumn(col, traceModeOn, cellTraceColor, singleHop, anyHighlight);\n    });\n    layoutColumns();\n    lastLinked = null;\n    renderEdges(traceModeOn, connTraceColor, connTraceHop, connTraceBow, singleHop, anyHighlight);\n    if (state.hideUnconnected && lastLinked && Object.keys(lastLinked).length){\n      applyHide(lastLinked);          // second pass: close up the columns, then route again on the new positions\n      layoutColumns();\n      renderEdges(traceModeOn, connTraceColor, connTraceHop, connTraceBow, singleHop, anyHighlight);\n    }\n    boardW = board.offsetWidth; boardH = board.offsetHeight;\n    if (cam.fit) fitCam();\n    clampCam(); applyCam(false);\n  }\n\n  function renderColumn(col, traceModeOn, cellTraceColor, singleHop, anyHighlight){\n    var meta = COL_META[col];\n    var wrap = document.createElement('div');\n    wrap.className = 'column' + (state.visibility[col] ? '' : ' collapsed');\n    wrap.dataset.col = col;\n\n    var visible = state.visibility[col];\n    var eyeIcon = visible\n      ? '\u003csvg viewBox=\"0 0 16 16\" fill=\"none\">\u003cpath d=\"M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"2.1\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003c/svg>'\n      : '\u003csvg viewBox=\"0 0 16 16\" fill=\"none\">\u003cpath d=\"M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"2.1\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003cline x1=\"2\" y1=\"14\" x2=\"14\" y2=\"2\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003c/svg>';\n    wrap.innerHTML =\n      '\u003cdiv class=\"col-head\">\u003cspan class=\"title\">'+meta.label+'\u003c/span>' +\n        '\u003cspan class=\"actions\">' +\n          '\u003cbutton class=\"toggle-btn reset-btn\" title=\"Clear highlighting\">Reset\u003c/button>' +\n          '\u003cbutton class=\"icon-btn eye-btn'+(visible?'':' is-hidden')+'\" title=\"'+(visible?'Hide':'Show')+' this column\">'+eyeIcon+'\u003c/button>' +\n        '\u003c/span>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"col-list\">\u003c/div>';\n\n    var list = wrap.querySelector('.col-list');\n    var prevGroup = null;\n    // Case-study sub-categories are drop-downs: only the D1 / D2 / C / B headings show until one\n    // is opened. A case study the user has selected (traced) stays visible even if its group is\n    // closed, so closing a group never silently breaks a trace that is on screen.\n    var groupInfo = {};\n    if (col === 'caseStudies'){\n      state.groupOrder.forEach(function(g){ groupInfo[g] = { total:0, active:0, lit:0 }; });\n      state.cells[col].forEach(function(cd){\n        var gi = groupInfo[cd.group] || (groupInfo[cd.group] = { total:0, active:0, lit:0 });\n        gi.total++;\n        if (state.activeTraces.indexOf(cd.id) !== -1) gi.active++;\n        if (anyHighlight){\n          var k = cellKey(col, cd.id);\n          var isLit = traceModeOn ? !!cellTraceColor[k] : !!(singleHop && singleHop.cellKeys[k]);\n          if (isLit) gi.lit++;\n        }\n      });\n    }\n    function makeGroupHeader(g){\n      var gi = groupInfo[g];\n      var isOpen = !!state.openGroups[g];\n      var head = document.createElement('button');\n      head.type = 'button';\n      head.className = 'group-toggle' + (isOpen ? ' open' : '');\n      head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');\n      head.title = (isOpen ? 'Hide ' : 'Show ') + (gi.total ? gi.total + ' case studies in ' : '') + g;\n      var badge = '';\n      if (!isOpen && (gi.active || gi.lit)){\n        badge = '\u003cspan class=\"group-badge\">' + (gi.active ? gi.active + ' selected' : gi.lit + ' linked') + '\u003c/span>';\n      }\n      head.innerHTML = '\u003cspan class=\"chev\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"group-name\">' + esc(g) + '\u003c/span>' +\n        '\u003cspan class=\"group-count\">' + gi.total + '\u003c/span>' + badge;\n      head.addEventListener('click', function(){\n        markCustom();\n        state.openGroups[g] = !state.openGroups[g];\n        renderAll();\n      });\n      return head;\n    }\n    if (col === 'access'){\n      renderStages(list, traceModeOn, cellTraceColor, singleHop, anyHighlight);\n    } else\n    state.cells[col].forEach(function(cellData, i){\n      if (col==='access' && i>0){\n        var arrow = document.createElement('div');\n        arrow.className = 'access-arrow';\n        arrow.textContent = '\u2193';\n        list.appendChild(arrow);\n      }\n      if (col==='caseStudies' && cellData.group && cellData.group !== prevGroup){\n        list.appendChild(makeGroupHeader(cellData.group));\n        prevGroup = cellData.group;\n      }\n      if (col==='caseStudies' && cellData.group && !state.openGroups[cellData.group] &&\n          state.activeTraces.indexOf(cellData.id) === -1) return;\n      list.appendChild(renderCell(col, cellData, traceModeOn, cellTraceColor, singleHop, anyHighlight));\n    });\n    if (col === 'caseStudies'){\n      state.groupOrder.forEach(function(g){\n        if (groupInfo[g].total > 0) return;\n        list.appendChild(makeGroupHeader(g));\n        if (state.openGroups[g]){\n          var empty = document.createElement('div');\n          empty.className = 'group-empty';\n          empty.textContent = 'No case studies yet';\n          list.appendChild(empty);\n        }\n      });\n    }\n\n    board.appendChild(wrap);\n\n    wrap.querySelector('.eye-btn').addEventListener('click', function(){\n      markCustom();\n      state.visibility[col] = !state.visibility[col];\n      if (col === 'access') state.visibility.barriers = state.visibility.access; // barriers sit inside the stages\n      renderAll();\n    });\n    wrap.querySelector('.reset-btn').addEventListener('click', function(){\n      markCustom();\n      state.selectedCells = [];\n      state.activeTraces = [];\n      toast('Highlighting cleared.');\n      renderAll();\n    });\n  }\n\n  // Barriers inside their stage, top to bottom (display order). Membership comes from the\n  // Barriers \u2192 Stages of Access connections in the data; the three barriers that belong to no\n  // stage sit in their own container below.\n  var STAGE_BARRIER_ORDER = {\n    motivational: ['b11','b12','b13','b14'],\n    physical:     ['b1','b3','b2','b5','b6','b10','b4','b19'],\n    skillsUse:    ['b7','b8','b9','b17','b15'],\n    outcomes:     []\n  };\n  var OUTSIDE_BARRIER_ORDER = ['b18','b16','b20'];\n  function renderStages(list, traceModeOn, cellTraceColor, singleHop, anyHighlight){\n    function litKey(k){ return traceModeOn ? !!cellTraceColor[k] : !!(singleHop && singleHop.cellKeys[k]); }\n    state.cells.access.forEach(function(stage, i){\n      if (i > 0){\n        var arrow = document.createElement('div');\n        arrow.className = 'stage-arrow';\n        arrow.textContent = '\\u2193';\n        list.appendChild(arrow);\n      }\n      // The container IS the stage: it carries the stage's id, highlight state and click.\n      var lit = litKey(cellKey('access', stage.id));\n      var box = document.createElement('div');\n      box.className = 'stage-box stage-' + stage.id + (anyHighlight ? (lit ? ' on' : ' dim') : '');\n      box.dataset.col = 'access';\n      box.dataset.id = stage.id;\n      var label = document.createElement('div');\n      label.className = 'stage-label';\n      label.textContent = stage.label;\n      box.appendChild(label);\n      var ids = STAGE_BARRIER_ORDER[stage.id] || [];\n      ids.forEach(function(bid){\n        var bd = getCell('barriers', bid);\n        if (bd) box.appendChild(renderCell('barriers', bd, traceModeOn, cellTraceColor, singleHop, anyHighlight));\n      });\n      if (!ids.length){\n        var note = document.createElement('div');\n        note.className = 'stage-note' + (anyHighlight && !lit ? ' dim' : '');\n        note.textContent = 'No barrier mapped (cumulative result of the previous stages)';\n        box.appendChild(note);\n      }\n      box.addEventListener('click', function(){ toggleCellSelection('access', stage.id); });\n      list.appendChild(box);\n    });\n    var gap = document.createElement('div');\n    gap.className = 'stage-gap';\n    list.appendChild(gap);\n    var out = document.createElement('div');\n    out.className = 'stage-box outside';\n    var title = document.createElement('div');\n    title.className = 'outside-title';\n    title.appendChild(document.createTextNode('Outside the stages'));\n    title.appendChild(document.createElement('br'));\n    title.appendChild(document.createTextNode('of access'));\n    out.appendChild(title);\n    OUTSIDE_BARRIER_ORDER.forEach(function(bid){\n      var bd = getCell('barriers', bid);\n      if (bd) out.appendChild(renderCell('barriers', bd, traceModeOn, cellTraceColor, singleHop, anyHighlight));\n    });\n    list.appendChild(out);\n  }\n\n  function renderCell(col, cellData, traceModeOn, cellTraceColor, singleHop, anyHighlight){\n    var el = document.createElement('div');\n    var key = cellKey(col, cellData.id);\n    var classes = ['cell', 'col-'+col];\n    var isCase = col === 'caseStudies';\n    if (isCase){\n      classes.push('case');\n      if (cellData.industry) classes.push('ind-'+cellData.industry);\n    }\n    if ((col === 'barriers' || col === 'capabilities') && cellData.unmapped) classes.push('unmapped');\n    if (anyHighlight){\n      var lit = traceModeOn ? !!cellTraceColor[key] : (singleHop && singleHop.cellKeys[key]);\n      classes.push(lit ? 'on' : 'dim');\n    }\n    el.className = classes.join(' ');\n    el.dataset.col = col;\n    el.dataset.id = cellData.id;\n\n    // Industry is shown through the cell's color alone (set via the ind-* class above) \u2014\n    // no separate text tag, so each case-study cell stays a single compact line.\n    el.innerHTML = esc(cellData.label);\n    if (cellData.slr){\n      el.title = cellData.label + '\\nSector: ' + cellData.sectorLabel + '\\nDevelopment level: ' + cellData.dev;\n      var lv = DEV_LEVELS[cellData.dev];\n      if
