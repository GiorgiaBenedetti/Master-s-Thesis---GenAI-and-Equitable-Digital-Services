  // ================= Digital Inclusion Wheel =================
  // Seven dimensions in equal sectors (Geography at the top, then clockwise), each with three rings from the outside
  // in (darkest = outer) and a white outer ring carrying the dimension's name; "EU 2021 'Above digital skills'" in
  // the centre. Every cell (the 21 ring cells and the 7 name cells) is a button: click to highlight it, click again
  // to remove the highlight; any number can be highlighted at once. Each Wheel panel keeps its own selection.
  var WHEEL_DIMS = [
    ['Geography',         ['Rural Areas', 'Towns', 'Cities']],
    ['Employment status', ['Retired', 'Unemployed', 'Employed']],
    ['Education',         ['Low', 'Medium', 'High']],
    ['Age',               ['55-74', '25-54', '16-24']],
    ['Ethnicity',         ['Non-EU country', 'Foreign born', 'Native']],
    ['Citizenship',       ['Nationals non EU', 'Non-nationals', 'Nationals']],
    ['Gender',            ['Female', '–', 'Male']]
  ];
  var WHEEL_R = { centre: 88, inner: 190, middle: 285, outer: 378, label: 432 };
  var wheelSeq = 0;   // unique ids for the text paths of every wheel on the canvas
  var WHEEL_FILL = ['#c6a3cd', '#dcc0de', '#efe2f0'];   // outer, middle, inner ring
  function buildWheelSvg(){
    var NS = 'http://www.w3.org/2000/svg', C = 450, n = WHEEL_DIMS.length, step = 360 / n, start = -step / 4;
    function pt(r, a){ var t = a * Math.PI / 180; return [C + r * Math.sin(t), C - r * Math.cos(t)]; }
    function sector(r0, r1, a0, a1){
      var p0 = pt(r1, a0), p1 = pt(r1, a1), p2 = pt(r0, a1), p3 = pt(r0, a0), large = (a1 - a0) > 180 ? 1 : 0;
      return 'M' + p0 + ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p1 + ' L' + p2 + ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p3 + ' Z';
    }
    function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
    var svg = el('svg', { viewBox: '0 0 900 900', class: 'wheel-svg', role: 'group', 'aria-label': 'Digital Inclusion Wheel', preserveAspectRatio: 'xMidYMid meet' });
    var defs = el('defs', {}, svg);
    function cell(r0, r1, a0, a1, fill, label, bold, key){
      var g = el('g', { class: 'wcell', role: 'button', tabindex: '0', 'aria-pressed': 'false', 'data-key': key }, svg);
      el('path', { d: sector(r0, r1, a0, a1), fill: fill }, g);
      // the text runs along the circle through the middle of the cell (clockwise, so it bulges outward like the rings)
      var rm = (r0 + r1) / 2, q0 = pt(rm, a0), q1 = pt(rm, a1), pid = 'wl' + (++wheelSeq);
      el('path', { id: pid, d: 'M' + q0 + ' A' + rm + ' ' + rm + ' 0 0 1 ' + q1, fill: 'none', stroke: 'none' }, defs);
      var t = el('text', { 'dominant-baseline': 'central', fill: '#241a30', 'font-size': bold ? 19 : 18, 'font-weight': bold ? 700 : 400 }, g);
      var tp = el('textPath', { href: '#' + pid, startOffset: '50%', 'text-anchor': 'middle' }, t);
      tp.textContent = label;
      var tt = el('title', {}, g); tt.textContent = label;
      return g;
    }
    var ringR = [[WHEEL_R.middle, WHEEL_R.outer], [WHEEL_R.inner, WHEEL_R.middle], [WHEEL_R.centre, WHEEL_R.inner]];
    WHEEL_DIMS.forEach(function(d, i){
      var a0 = start + i * step, a1 = a0 + step;
      cell(WHEEL_R.outer, WHEEL_R.label, a0, a1, '#ffffff', d[0], true, 'dim:' + i);
      d[1].forEach(function(v, j){ cell(ringR[j][0], ringR[j][1], a0, a1, WHEEL_FILL[j], v, false, 'v:' + i + ':' + j); });
    });
    // lines: the sector dividers from the centre circle to the outside, and the outer circle
    var lines = el('g', { fill: 'none', stroke: '#6f6a74', 'stroke-width': 1, 'pointer-events': 'none' }, svg);
    for (var i = 0; i < n; i++){ var a = start + i * step, q0 = pt(WHEEL_R.centre, a), q1 = pt(WHEEL_R.label, a); el('line', { x1: q0[0], y1: q0[1], x2: q1[0], y2: q1[1] }, lines); }
    el('circle', { cx: C, cy: C, r: WHEEL_R.label }, lines);
    el('circle', { cx: C, cy: C, r: WHEEL_R.outer, stroke: '#8a7d92', 'stroke-width': 0.6 }, lines);
    // centre
    var cg = el('g', { 'pointer-events': 'none' }, svg);
    el('circle', { cx: C, cy: C, r: WHEEL_R.centre, fill: '#ffffff', stroke: '#6f6a74', 'stroke-width': 1 }, cg);
    ['EU 2021', '“Above digital', 'skills”'].forEach(function(s, k){
      var t = el('text', { x: C, y: C + (k - 1) * 22, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 17,
        'font-weight': 700, 'font-style': 'italic', fill: '#241a30' }, cg);
      t.textContent = s;
    });
    return svg;
  }
  function spawnWheelNode(anchorEl, skipConnector, dropPos){
    var W = 720, H = 800;
    var pos = dropPos ? centerOnPoint(dropPos, W, H) : ((!skipConnector && attachPos(anchorEl)) || placeNewNode(anchorEl, W, H));
    var node = document.createElement('div');
    node.className = 'node spawned tool-node wheel-node';
    node.style.left = pos.x + 'px';
    node.style.top = pos.y + 'px';
    node.innerHTML =
      '<div class="node-head">' +
        '<span class="title">Digital Inclusion Wheel<span class="sub">Click the cells to highlight them; several can be highlighted at once</span></span>' +
        '<span class="head-btns"><button class="fs-btn" type="button" title="Show this tool full screen">Full screen</button>' +
        '<button class="remove-node-btn" title="Remove">×</button></span>' +
      '</div>' +
      '<div class="wheel-mount"><div class="wheel-bar"><span class="w-count"></span><button type="button" class="w-clear" disabled>Clear selection</button></div></div>';
    board.appendChild(node);
    var mount = node.querySelector('.wheel-mount'), svg = buildWheelSvg();
    mount.appendChild(svg);
    var countEl = node.querySelector('.w-count'), clearBtn = node.querySelector('.w-clear');
    function sync(){
      var n = svg.querySelectorAll('.wcell.on').length;
      countEl.textContent = n ? n + ' highlighted' : '';
      clearBtn.disabled = !n;
    }
    function toggle(g){ var on = !g.classList.contains('on'); g.classList.toggle('on', on); g.setAttribute('aria-pressed', on ? 'true' : 'false'); sync(); }
    Array.prototype.forEach.call(svg.querySelectorAll('.wcell'), function(g){
      g.addEventListener('click', function(e){ e.stopPropagation(); toggle(g); });
      g.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(g); } });
    });
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      Array.prototype.forEach.call(svg.querySelectorAll('.wcell.on'), function(g){ g.classList.remove('on'); g.setAttribute('aria-pressed', 'false'); });
      sync();
    });

    var headEl = node.querySelector('.node-head');
    makeDraggable(node, headEl);
    node.querySelector('.remove-node-btn').addEventListener('click', function(){ removeSpawnedNode(node); });
    node.querySelector('.fs-btn').addEventListener('click', function(e){
      e.stopPropagation();
      if (fsState && fsState.node === node) exitFullscreen(); else enterFullscreen(node);
    });
    if (!skipConnector) connections.push({ id: uid('lnk-'), fromEl: anchorEl, toEl: node });
    updateLayout();
  }

  // Places a brand-new, free-standing copy of one of the four activities — used by the
  // Library node. Unlike the original four, a copy is removable (× in its header) and isn't
  // connected to anything; it reuses the exact same renderActivityNode used for the originals,
  // so its own sections keep their own "+" attach points.
  function spawnActivityCopy(activity, anchorEl, dropPos){
    var pos = dropPos ? centerOnPoint(dropPos, 380, 460) : (libraryPos(anchorEl) || placeNewNode(anchorEl, 380, 460));
    var copy = renderActivityNode(activity, pos.x, pos.y);
    var headEl = copy.querySelector('.node-head');
    var removeBtn = document.createElement('button');
    removeBtn.className = 'remove-node-btn';
    removeBtn.type = 'button';
    removeBtn.title = 'Remove this copy';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', function(e){ e.stopPropagation(); removeSpawnedNode(copy); });
    headEl.appendChild(removeBtn);
    updateLayout();
  }

  // Activity cards clicked in the Library: 90 px to the right of the Library, top edge in line with its top edge;
  // each further one stacks below the previous with the same 90 px gap (cards dragged out of that column don't count).
  function libraryPos(anchorEl){
    var lib = anchorEl && anchorEl.closest ? anchorEl.closest('.library-node') : null;
    if (!lib) return null;
    // to the right of the right-most Library panel on the same row, so copies never cover the Tools library
    var right = (parseFloat(lib.style.left) || 0) + lib.offsetWidth, libTop = parseFloat(lib.style.top) || 0;
    Array.prototype.forEach.call(board.querySelectorAll('.library-node'), function(l){
      if (Math.abs((parseFloat(l.style.top) || 0) - libTop) > 200) return;
      right = Math.max(right, (parseFloat(l.style.left) || 0) + l.offsetWidth);
    });
    var x = right + ATTACH_GAP;
    var y = libTop, bottom = null;
    Array.prototype.forEach.call(board.querySelectorAll('.activity-node'), function(n){
      if (Math.abs((parseFloat(n.style.left) || 0) - x) > 1) return;
      var b = (parseFloat(n.style.top) || 0) + n.offsetHeight;
      bottom = bottom === null ? b : Math.max(bottom, b);
    });
    return { x: x, y: bottom === null ? y : bottom + ATTACH_GAP };
  }
  function centerOnPoint(pt, w, h){
    return { x: Math.max(20, pt.x - w/2), y: Math.max(20, pt.y - h/2) };
  }
  function screenToLocal(clientX, clientY){
    var boardRect = board.getBoundingClientRect();
    return { x: (clientX - boardRect.left)/zoom, y: (clientY - boardRect.top)/zoom };
  }
  function isOverCanvas(clientX, clientY){
    var r = canvasWrap.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }

  // Drag-and-drop for Library cards, with a plain click still working as a shortcut.
  // A small threshold tells a drag apart from a click; past it, a ghost label follows the
  // cursor and, on release over the canvas, onDrop gets where to place the new node (in the
  // board's local/unscaled coordinates, already zoom-corrected). Released outside the canvas
  // cancels the drag; released without moving falls back to onPlainClick (spawn near the Library).
  var DRAG_THRESHOLD = 6;
  function attachLibraryDrag(btnEl, label, onDrop, onPlainClick){
    var startX = 0, startY = 0, dragging = false, ghost = null;
    btnEl.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      dragging = false;
      document.body.classList.add('node-dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
    function onMove(e){
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!dragging && Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD){
        dragging = true;
        btnEl.classList.add('dragging');
        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = label;
        document.body.appendChild(ghost);
      }
      if (dragging && ghost){
        ghost.style.left = (e.clientX + 14) + 'px';
        ghost.style.top = (e.clientY + 14) + 'px';
        ghost.classList.toggle('invalid', !isOverCanvas(e.clientX, e.clientY));
      }
    }
    function onUp(e){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      btnEl.classList.remove('dragging');
      document.body.classList.remove('node-dragging');
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging){
        if (isOverCanvas(e.clientX, e.clientY)) onDrop(screenToLocal(e.clientX, e.clientY));
      } else {
        onPlainClick();
      }
    }
  }

  // ================= Library nodes: two pickers, one for activities and one for tools =================
  // Each shows only its title; a drop-down below the title opens the list of cards. Clicking a card places a
  // copy on the canvas, dragging it drops the copy where it is released.
  function renderLibraryNode(x, y, kind){
    var isTools = kind === 'tools';
    var node = document.createElement('div');
    node.className = 'node library-node';
    node.setAttribute('data-lib', kind);
    node.style.left = x + 'px';
    node.style.top = y + 'px';

    var headEl = document.createElement('div');
    headEl.className = 'node-head';
    headEl.innerHTML = '<span class="pill">Library</span><h2>' + (isTools ? 'Tools' : 'Activities') + '</h2>';
    node.appendChild(headEl);

    var count = isTools ? Object.keys(TOOL_META).length : ACTIVITIES.length;
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'lib-toggle';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.innerHTML = '<span>' + (isTools ? 'All tools' : 'All activities') + ' <span class="lib-count">(' + count + ')</span></span><span class="chev">\u25BE</span>';
    node.appendChild(toggle);

    var body = document.createElement('div');
    body.className = 'library-body';

    if (!isTools){
      ACTIVITIES.forEach(function(activity){
        var btn = document.createElement('button');
        btn.className = 'library-item';
        btn.type = 'button';
        btn.innerHTML =
          '<div class="card-title"><span>'+esc(activity.title)+'</span></div>' +
          '<div class="card-desc">'+esc(activity.objective || '')+'</div>';
        attachLibraryDrag(btn, activity.title,
          function(localPos){ spawnActivityCopy(activity, headEl, localPos); },
          function(){ spawnActivityCopy(activity, headEl); });
        body.appendChild(btn);
      });
    } else {
      Object.keys(TOOL_META).forEach(function(key){
        var meta = TOOL_META[key];
        var btn = document.createElement('button');
        btn.className = 'library-item' + (meta.built ? '' : ' disabled');
        btn.type = 'button';
        btn.innerHTML =
          '<div class="card-title"><span>'+esc(meta.label)+'</span>' + (meta.built ? '' : '<span class="tag">not built</span>') + '</div>' +
          '<div class="card-desc">'+esc(meta.desc || '')+'</div>';
        if (meta.built){
          attachLibraryDrag(btn, meta.label,
            function(localPos){ toolSpawner(key)(headEl, true, localPos); },
            function(){ toolSpawner(key)(headEl, true); });
        } else {
          btn.addEventListener('click', function(){
            toast('"'+meta.label+'" isn\'t built yet.');
          });
        }
        body.appendChild(btn);
      });
    }

    toggle.addEventListener('click', function(){
      var open = !node.classList.contains('open');
      node.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      updateLayout();
    });

    node.appendChild(body);
    board.appendChild(node);
    makeDraggable(node, headEl);
    return node;
  }

  // ================= Info node: the former page header, now a draggable canvas node =================
  function renderInfoNode(x, y){
    var node = document.createElement('div');
    node.className = 'node info-node';
    node.style.left = x + 'px';
    node.style.top = y + 'px';

    var headEl = document.createElement('div');
    headEl.className = 'node-head';
    headEl.innerHTML =
      '<span class="pill">Info</span>' +
      '<h2>How to use this canvas</h2>';
    node.appendChild(headEl);

    var body = document.createElement('div');
    body.className = 'info-body';
    body.innerHTML =
      '<p>Work through the four activities in order (Empathising, Exploring, Evaluating, Reflecting), using the tools to support each step.</p>' +
      '<p>Start from the two <b>Libraries</b>, Activities and Tools: open the drop-down, then click a card to place it on the canvas, or drag it where you want it.</p>' +
      '<p>Use the <b>+</b> on an activity\'s panel to attach a tool or a blank box for notes and images.</p>' +
      '<p>Drag a panel by its header, and resize it from its right edge or bottom corners. Tools can also be opened full screen.</p>' +
      '<p>To remove something, use the <b>×</b> in a panel\'s header, or the <b>×</b> on a connector line to remove that attachment.</p>' +
      '<p>Zoom the canvas with <b>− / +</b> in the bottom-right corner, or hold Ctrl/Cmd and scroll.</p>' +
      '<p class="note">Greyed-out tools are not available yet. Notes and images are not saved: they disappear when the page is reloaded.</p>';
    node.appendChild(body);

    board.appendChild(node);
    makeDraggable(node, headEl);
    return node;
  }

  // ================= boot =================
  // The canvas starts with only the Info node and the two Library nodes (Activities, Tools) — every activity and tool
  // on the canvas, including the "first" copy of each, comes from picking it there.
  renderInfoNode(30, 30);
  renderLibraryNode(630, 30, 'activities');
  renderLibraryNode(1000, 30, 'tools');
  updateLayout();
  // default view: 83%, with the Info and Library panels framed in the top-left corner
  setZoom(DEFAULT_ZOOM);
  canvasWrap.scrollLeft = 0; canvasWrap.scrollTop = 0;
  window.addEventListener('resize', updateLayout);
})();
</script>
